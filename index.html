letter-spacing: 0px;

white-space: nowrap;

#supportButton {

    .settings-section-title {

    }

    .setting-box {

      margin-bottom: 18px;

      text-align: left;

    }

    .setting-box label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      color: #4a4a4a;

      font-weight: bold;

      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35);

    }

    .setting-box select {

      width: 100%;

      height: 48px;

      padding: 0 12px;

      border: 1px solid #555;

      border-radius: 8px;

      background: #1c1c1c;

      color: #fff;

    }

    #settingError {

      min-height: 24px;

      margin-top: 12px;

      color: #ff5555;

      font-size: 14px;

    }

    .game-header {

      margin-bottom: 18px;

    }

    .game-title {

      margin: 0;

      font-size: 26px;

      letter-spacing: 3px;

    }

    #status {

  min-height: 38px;

  margin-top: 12px;

  font-size: clamp(28px, 7vw, 46px);

  font-weight: 900;

  letter-spacing: 2px;

  color: #fff;

  text-shadow:

    0 2px 5px #000,

    0 0 12px rgba(0, 0, 0, 0.8);

}

#status.turn-pop {

  animation: turnPop 0.45s ease-out;

}

@keyframes turnPop {

  0% {

    transform: scale(0.85);

    opacity: 0.5;

  }

  55% {

    transform: scale(1.13);

    opacity: 1;

  }

  100% {

    transform: scale(1);

    opacity: 1;

  }

}
    
    #gameInfo {

      color: #888;

      font-size: 12px;

    }

    #board {

      display: grid;

      width: 100%;

      gap: 8px;

      margin: 12px auto 0;

    }

    .card {

      padding: 0;

      border: 0;

      border-radius: 8px;

      overflow: hidden;

      background: transparent;

      aspect-ratio: 63 / 88;

      cursor: pointer;

      transition: transform 0.12s ease;

    }

    .card.dealing {

      animation: dealIn 0.14s ease-out;

    }

    @keyframes dealIn {

      from {

        opacity: 0;

        transform: translateY(-10px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }

    .card:active {

      transform: scale(0.96);

    }

    .card:disabled {

      cursor: default;

    }

    .card img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    #deadFxOverlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 2000;

      overflow: hidden;

      pointer-events: none;

    }

    #deadFxOverlay.active {

      display: block;

    }

    #deadFxOverlay.running {

      pointer-events: auto;

    }

    #deadFxBlack {

      position: absolute;

      inset: 0;

      z-index: 20;

      background: #000;

      opacity: 0;

      transition: opacity 0.18s linear;

    }

    #deadFxBlack.show {

      opacity: 1;

    }

    #deadFxRed {

      position: absolute;

      inset: 0;

      z-index: 2;

      background: rgba(150, 0, 0, 0.42);

      opacity: 0;

      transition: opacity 0.18s linear;

    }

    #deadFxRed.show {

      opacity: 1;

    }

    .dead-fx-image {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: contain;

      opacity: 0;

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;

    }

    #deadFxSkull1 {

      z-index: 10;

    }

    #deadFxBullet {

      z-index: 30;

    }

    #deadFxBlood {

      z-index: 31;

    }

    #deadFxSkull2 {

      z-index: 5;

    }

    #deadFxLogo {

      z-index: 6;

    }

    #deadTapLayer {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 3000;

      background: transparent;

      cursor: pointer;

    }

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding-bottom: 32px;

    }

    #deadTapText {

      padding: 10px 18px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-size: 13px;

      letter-spacing: 2px;

    .result-box {

      width: 100%;

      max-width: 420px;

      padding: 26px 20px;

      border-radius: 12px;

      color: #d00000;

      font-size: 32px;

      font-weight: bold;

    }

    .result-line {

      margin: 10px 0;

      font-size: 20px;

    }

    .total-shots {

      margin: 22px 0;

      font-size: 34px;

      font-weight: bold;

    }

.settings-accordion {

  border: 1px solid rgba(55, 35, 19, 0.35);

}

.settings-toggle {

  text-align: left;

  cursor: pointer;

}

.settings-toggle::after {

  content: "＋";

  font-size: 18px;

}

.settings-toggle[aria-expanded="true"]::after {

  content: "－";

}

.settings-panel {

  padding: 15px 13px 4px;

}

.settings-panel[hidden] {

  display: none;

}

.settings-panel .setting-box {

  margin-bottom: 15px;

}

.name-input {

  width: 100%;

  height: 44px;

  padding: 0 12px;

  border: 1px solid #666;

  border-radius: 7px;

  background: #1c1c1c;

  color: #fff;

  font: inherit;

}

.name-note {

  color: #4a4039;

  font-size: 12px;

  margin: 0 0 13px;

}

/* DB TURN ORDER PANEL */

#turnOrderPanel {

  position: absolute;

  top: 12px;

  right: 10px;

  z-index: 10;

  width: clamp(145px, 34vw, 205px);

  padding: 9px 8px;

  border: 1px solid rgba(255, 255, 255, 0.16);

  border-radius: 8px;

  background: rgba(0, 0, 0, 0.28);

  color: rgba(255, 255, 255, 0.78);

  pointer-events: none;

  font-size: clamp(9px, 2.4vw, 12px);

  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);

}

.turn-order-heading {

  font-size: 0.85em;

  letter-spacing: 1px;

  margin-bottom: 5px;

}

.turn-order-entry {

  display: flex;

  align-items: center;

  gap: 5px;

  padding: 4px 3px;

  border-radius: 4px;

  min-width: 0;

}

.turn-order-entry.current {

  background: rgba(175, 34, 27, 0.50);

  color: #fff;

  font-weight: bold;

}

.turn-order-name {

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

}

.turn-order-num {

  opacity: 0.75;

  flex: 0 0 auto;

}
  
/* DB CUSTOM PENALTY */

#randomPenaltySettings[hidden],

#levelPenaltySettings[hidden],

#drinkPenaltySettings[hidden],

#customPenaltyResult[hidden] {

  display: none;

}

.penalty-note {

  margin: 6px 0 14px;

  color: #493b32;

  font-size: 12px;

  text-align: left;

}

.penalty-level-heading {

  margin: 18px 0 9px;

  color: #35251c;

  font-weight: bold;

  text-align: left;

}

.penalty-input {

  display: block;

  width: 100%;

  min-height: 44px;

  margin: 7px 0;

  padding: 9px 12px;

  border: 1px solid #666;

  border-radius: 7px;

  background: #1c1c1c;

  color: #fff;

  font: inherit;

}

#customPenaltyResult {

  margin: 22px 0;

  color: #fff;

}

.custom-penalty-heading {

  margin: 10px 0;

  font-size: 26px;

  font-weight: bold;

}

.custom-penalty-item {

  padding: 10px;

  margin: 7px 0;

  border: 1px solid #555;

  border-radius: 7px;

  overflow-wrap: anywhere;

  background: rgba(0, 0, 0, 0.3);

}
  
    /* DB MULTI DEAD ADDITIONS */

.turn-order-stock {

  margin-left: auto;

  flex: 0 0 auto;

  color: #e8c38d;

  font-weight: bold;

  font-size: 0.9em;

}

.card.interim-dead {

  position: relative;

}

.card.interim-dead::after {

  content: "";

  position: absolute;

  inset: 12%;

  background:

    url("images/doa-dankon.PNG")

    center / contain no-repeat;

  pointer-events: none;

}

    async function loadDealSound() {

        const AudioContextClass =

          window.AudioContext

          || window.webkitAudioContext;

        if (!AudioContextClass) {

          return;

        }

        if (!dealAudioContext) {

          dealAudioContext =

            new AudioContextClass();

        }

        const response =

          await fetch(

            DEAL_SOUND_URL

          );

        const arrayBuffer =

          await response.arrayBuffer();

        dealAudioBuffer =

          await dealAudioContext

            .decodeAudioData(

              arrayBuffer

            );

      } catch (error) {

        console.error(

          error

        );

      }

    }

    async function resumeDealAudio() {

      if (!dealAudioContext) {

        await loadDealSound();

      }

      if (

        dealAudioContext

        && dealAudioContext.state

        === "suspended"

      ) {

        try {

          await dealAudioContext.resume();

        } catch (error) {

          console.error(

            error

          );

        }

      }

        !dealAudioContext

        return;

      const source =

        dealAudioContext

          .createBufferSource();

      source.buffer =

        dealAudioBuffer;

      source.connect(

        dealAudioContext.destination

      );

      source.start(0);

  }).catch(error=>console.warn('DOA title assets unavailable; original menu retained.',error));
})();
</script>
