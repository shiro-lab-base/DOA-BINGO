<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0"

  >

  <title>DOA BINGO</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: #fff;

      font-family: Arial, sans-serif;

    }

    button,

    select {

      font: inherit;

    }

    .screen {

      display: none;

      width: 100%;

      min-height: 100vh;

      padding: 24px 18px;

    }

    .screen.active {

      display: flex;

      flex-direction: column;

      align-items: center;

    }

    .container {

      width: 100%;

      max-width: 500px;

      text-align: center;

    }

    h1 {

      margin: 0;

      font-size: 38px;

      letter-spacing: 4px;

    }

    h2 {

      margin: 0 0 28px;

      letter-spacing: 2px;

    }

    .subtitle {

      margin-top: 8px;

      color: #888;

      font-size: 13px;

    }

    .main-button {

      width: 100%;

      min-height: 52px;

      margin-top: 20px;

      border: 0;

      border-radius: 8px;

      background: #fff;

      color: #000;

      font-weight: bold;

      cursor: pointer;

    }

    .secondary-button {

      width: 100%;

      min-height: 48px;

      margin-top: 12px;

      border: 1px solid #666;

      border-radius: 8px;

      background: transparent;

      color: #fff;

      font-weight: bold;

      cursor: pointer;

    }

    #titleScreen {

      justify-content: center;

    }

    .title-wrap {

      width: 100%;

      max-width: 420px;

      text-align: center;

    }

    .setting-box {

      margin-bottom: 18px;

      text-align: left;

    }

    .setting-box label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      color: #aaa;

    }

    .setting-box select {

      width: 100%;

      height: 48px;

      padding: 0 12px;

      border: 1px solid #555;

      border-radius: 8px;

      background: #1c1c1c;

      color: #fff;

    }

    #settingError {

      min-height: 24px;

      margin-top: 12px;

      color: #ff5555;

      font-size: 14px;

    }

    #gameScreen {

      justify-content: flex-start;

      position: relative;

    }

    .game-header {

      margin-bottom: 18px;

    }

    .game-title {

      margin: 0;

      font-size: 26px;

      letter-spacing: 3px;

    }

    #status {

      min-height: 38px;

      margin-top: 12px;

      font-size: 20px;

      font-weight: bold;

    }

    #gameInfo {

      color: #888;

      font-size: 12px;

    }

    #board {

      display: grid;

      width: 100%;

      gap: 8px;

      margin: 12px auto 0;

    }

    .card {

      padding: 0;

      border: 0;

      border-radius: 8px;

      overflow: hidden;

      background: transparent;

      aspect-ratio: 63 / 88;

      cursor: pointer;

      transition: transform 0.12s ease;

    }

    .card.dealing {

      animation: dealIn 0.14s ease-out;

    }

    @keyframes dealIn {

      from {

        opacity: 0;

        transform: translateY(-10px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }

    .card:active {

      transform: scale(0.96);

    }

    .card:disabled {

      cursor: default;

    }

    .card img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    #deadTapLayer {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 999;

      background: transparent;

      cursor: pointer;

    }

    #deadTapLayer.active {

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding-bottom: 32px;

    }

    #deadTapText {

      padding: 10px 18px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-size: 13px;

      letter-spacing: 2px;

    }

    #resultScreen {

      justify-content: center;

    }

    .result-box {

      width: 100%;

      max-width: 420px;

      padding: 26px 20px;

      border: 1px solid #444;

      border-radius: 12px;

      background: #191919;

      text-align: center;

    }

    #resultTitle {

      margin-bottom: 22px;

      color: #d00000;

      font-size: 32px;

      font-weight: bold;

    }

    .result-line {

      margin: 10px 0;

      font-size: 20px;

    }

    .total-shots {

      margin: 22px 0;

      font-size: 34px;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <section

    id="titleScreen"

    class="screen active"

  >

    <div class="title-wrap">

      <h1>DOA BINGO</h1>

      <div class="subtitle">

        DEAD OR ALIVE

      </div>

      <button

        id="titleStartButton"

        class="main-button"

      >

        START

      </button>

    </div>

  </section>

  <section

    id="settingsScreen"

    class="screen"

  >

    <div class="container">

      <h2>GAME SETTINGS</h2>

      <div class="setting-box">

        <label for="humanCount">

          HUMAN PLAYERS

        </label>

        <select id="humanCount">

          <option value="1" selected>1</option>

          <option value="2">2</option>

          <option value="3">3</option>

          <option value="4">4</option>

        </select>

      </div>

      <div class="setting-box">

        <label for="cpuCount">

          CPU PLAYERS

        </label>

        <select id="cpuCount">

          <option value="0">0</option>

          <option value="1" selected>1</option>

          <option value="2">2</option>

          <option value="3">3</option>

        </select>

      </div>

      <div class="setting-box">

        <label for="boardSize">

          BOARD SIZE

        </label>

        <select id="boardSize">

          <option value="3" selected>3 × 3</option>

          <option value="4">4 × 4</option>

          <option value="5">5 × 5</option>

        </select>

      </div>

      <div class="setting-box">

        <label for="deadCount">

          DEAD CARDS

        </label>

        <select id="deadCount"></select>

      </div>

      <div id="settingError"></div>

      <button

        id="gameStartButton"

        class="main-button"

      >

        START GAME

      </button>

      <button

        id="backTitleButton"

        class="secondary-button"

      >

        TITLE

      </button>

    </div>

  </section>

  <section

    id="gameScreen"

    class="screen"

  >

    <div class="container">

      <div class="game-header">

        <div class="game-title">

          DOA BINGO

        </div>

        <div id="status">

          PLAYER 1 TURN

        </div>

        <div id="gameInfo"></div>

      </div>

      <div id="board"></div>

    </div>

    <div id="deadTapLayer">

      <div id="deadTapText">

        TAP TO RESULT

      </div>

    </div>

  </section>

  <section

    id="resultScreen"

    class="screen"

  >

    <div class="result-box">

      <div id="resultTitle">

        PLAYER 1 LOSE

      </div>

      <div class="result-line">

        DEAD：1

      </div>

      <div class="result-line">

        BINGO：

        <span id="resultBingo">0</span>

      </div>

      <div class="total-shots">

        TOTAL：

        <span id="resultShots">1</span>

        SHOTS

      </div>

      <button

        id="retryButton"

        class="main-button"

      >

        PLAY AGAIN

      </button>

      <button

        id="resultSettingsButton"

        class="secondary-button"

      >

        SETTINGS

      </button>

    </div>

  </section>

  <audio

    id="bgm"

    src="audio/doa-bgm.mp3"

    preload="auto"

    loop

  ></audio>

  <audio

    id="cardFlickSound"

    src="audio/doa-card-flick.wav"

    preload="auto"

  ></audio>

  <script>

    const IMAGE_BACK = "images/doa-back.PNG";

    const IMAGE_ALIVE = "images/doa-alive.PNG";

    const IMAGE_DEAD = "images/doa-dead.PNG";

    const DEAL_SOUND_URL =

      "audio/doa-card-placement.wav";

    const GAME_START_DEAL_DELAY_MS = 400;

    const DEAL_ANIMATION_MS = 140;

    const DEAL_GAP_MS = 150;

    const FLIP_DELAY_MS = 350;

    const titleScreen =

      document.getElementById("titleScreen");

    const settingsScreen =

      document.getElementById("settingsScreen");

    const gameScreen =

      document.getElementById("gameScreen");

    const resultScreen =

      document.getElementById("resultScreen");

    const titleStartButton =

      document.getElementById("titleStartButton");

    const gameStartButton =

      document.getElementById("gameStartButton");

    const backTitleButton =

      document.getElementById("backTitleButton");

    const retryButton =

      document.getElementById("retryButton");

    const resultSettingsButton =

      document.getElementById("resultSettingsButton");

    const humanCountSelect =

      document.getElementById("humanCount");

    const cpuCountSelect =

      document.getElementById("cpuCount");

    const boardSizeSelect =

      document.getElementById("boardSize");

    const deadCountSelect =

      document.getElementById("deadCount");

    const settingError =

      document.getElementById("settingError");

    const board =

      document.getElementById("board");

    const status =

      document.getElementById("status");

    const gameInfo =

      document.getElementById("gameInfo");

    const resultTitle =

      document.getElementById("resultTitle");

    const resultBingo =

      document.getElementById("resultBingo");

    const resultShots =

      document.getElementById("resultShots");

    const deadTapLayer =

      document.getElementById("deadTapLayer");

    const bgm =

      document.getElementById("bgm");

    const cardFlickSound =

      document.getElementById("cardFlickSound");

    let dealAudioContext = null;

    let dealAudioBuffer = null;

    let players = [];

    let cards = [];

    let currentPlayerIndex = 0;

    let boardSize = 3;

    let deadCardCount = 1;

    let gameOver = false;

    let inputLocked = false;

    let cpuTimer = null;

    let dealTimer = null;

    let flipTimer = null;

    let awaitingResult = false;

    let pendingLoser = null;

    bgm.volume = 0.35;

    cardFlickSound.volume = 1;

    async function loadDealSound() {

      try {

        const AudioContextClass =

          window.AudioContext

          || window.webkitAudioContext;

        if (!AudioContextClass) {

          return;

        }

        if (!dealAudioContext) {

          dealAudioContext =

            new AudioContextClass();

        }

        const response =

          await fetch(

            DEAL_SOUND_URL

          );

        const arrayBuffer =

          await response.arrayBuffer();

        dealAudioBuffer =

          await dealAudioContext

            .decodeAudioData(

              arrayBuffer

            );

      } catch (error) {

        console.error(

          "Deal sound load error:",

          error

        );

      }

    }

    async function resumeDealAudio() {

      if (!dealAudioContext) {

        await loadDealSound();

      }

      if (

        dealAudioContext

        && dealAudioContext.state

        === "suspended"

      ) {

        try {

          await dealAudioContext.resume();

        } catch (error) {

          console.error(

            "Deal audio resume error:",

            error

          );

        }

      }

    }

    function playDealSound() {

      if (

        !dealAudioContext

        || !dealAudioBuffer

      ) {

        return;

      }

      const source =

        dealAudioContext

          .createBufferSource();

      source.buffer =

        dealAudioBuffer;

      source.connect(

        dealAudioContext.destination

      );

      source.start(0);

    }

    function playSound(sound) {

      sound.pause();

      sound.currentTime = 0;

      const playPromise =

        sound.play();

      if (

        playPromise

        && typeof playPromise.catch

        === "function"

      ) {

        playPromise.catch(() => {});

      }

    }

    function startBgm() {

      const playPromise =

        bgm.play();

      if (

        playPromise

        && typeof playPromise.catch

        === "function"

      ) {

        playPromise.catch(() => {});

      }

    }

    function pauseBgm() {

      bgm.pause();

    }

    function showScreen(screen) {

      [

        titleScreen,

        settingsScreen,

        gameScreen,

        resultScreen

      ].forEach(

        item =>

          item.classList.remove("active")

      );

      screen.classList.add("active");

    }

    function updateDeadOptions() {

      const size =

        Number(

          boardSizeSelect.value

        );

      const totalCards =

        size * size;

      const previousValue =

        Number(

          deadCountSelect.value

        ) || 1;

      deadCountSelect.innerHTML =

        "";

      for (

        let i = 1;

        i < totalCards;

        i++

      ) {

        const option =

          document.createElement(

            "option"

          );

        option.value =

          i;

        option.textContent =

          i;

        deadCountSelect.appendChild(

          option

        );

      }

      deadCountSelect.value =

        Math.min(

          previousValue,

          totalCards - 1

        );

    }

    function createPlayers(

      humanCount,

      cpuCount

    ) {

      players = [];

      let playerNumber =

        1;

      for (

        let i = 0;

        i < humanCount;

        i++

      ) {

        players.push({

          number: playerNumber,

          type: "HUMAN"

        });

        playerNumber++;

      }

      for (

        let i = 0;

        i < cpuCount;

        i++

      ) {

        players.push({

          number: playerNumber,

          type: "CPU"

        });

        playerNumber++;

      }

    }

    function startGameFromSettings() {

      const humanCount =

        Number(

          humanCountSelect.value

        );

      const cpuCount =

        Number(

          cpuCountSelect.value

        );

      const totalPlayers =

        humanCount + cpuCount;

      if (

        totalPlayers < 2

        || totalPlayers > 4

      ) {

        settingError.textContent =

          "プレイヤー合計人数は2〜4人にしてください。";

        return;

      }

      settingError.textContent =

        "";

      boardSize =

        Number(

          boardSizeSelect.value

        );

      deadCardCount =

        Number(

          deadCountSelect.value

        );

      createPlayers(

        humanCount,

        cpuCount

      );

      startGame();

    }

    function startGame() {

      clearTimeout(

        cpuTimer

      );

      clearTimeout(

        dealTimer

      );

      clearTimeout(

        flipTimer

      );

      gameOver =

        false;

      inputLocked =

        true;

      awaitingResult =

        false;

      pendingLoser =

        null;

      currentPlayerIndex =

        0;

      deadTapLayer

        .classList

        .remove(

          "active"

        );

      createCards();

      prepareBoard();

      status.textContent =

        "DEALING...";

      gameInfo.textContent =

        `${boardSize}×${boardSize} / DEAD ${deadCardCount}`;

      showScreen(

        gameScreen

      );

      dealTimer =

        setTimeout(

          dealCards,

          GAME_START_DEAL_DELAY_MS

        );

    }

    function createCards() {

      const totalCards =

        boardSize

        * boardSize;

      cards =

        [];

      for (

        let i = 0;

        i < deadCardCount;

        i++

      ) {

        cards.push({

          type: "DEAD",

          opened: false

        });

      }

      while (

        cards.length

        < totalCards

      ) {

        cards.push({

          type: "ALIVE",

          opened: false

        });

      }

      shuffle(

        cards

      );

    }

    function shuffle(array) {

      for (

        let i =

          array.length - 1;

        i > 0;

        i--

      ) {

        const j =

          Math.floor(

            Math.random()

            * (i + 1)

          );

        [

          array[i],

          array[j]

        ] = [

          array[j],

          array[i]

        ];

      }

    }

    function prepareBoard() {

      board.innerHTML =

        "";

      board.style

        .gridTemplateColumns =

        `repeat(${boardSize}, 1fr)`;

    }

    function dealCards() {

      let index =

        0;

      function dealNextCard() {

        if (

          index

          >= cards.length

        ) {

          inputLocked =

            false;

          updateTurn();

          return;

        }

        const button =

          document.createElement(

            "button"

          );

        button.className =

          "card dealing";

        button.dataset.index =

          index;

        const cardIndex =

          index;

        button.addEventListener(

          "click",

          () =>

            selectCard(

              cardIndex

            )

        );

        const image =

          document.createElement(

            "img"

          );

        image.src =

          IMAGE_BACK;

        image.alt =

          "CARD BACK";

        button.appendChild(

          image

        );

        playDealSound();

        board.appendChild(

          button

        );

        index++;

        dealTimer =

          setTimeout(

            () => {

              dealTimer =

                setTimeout(

                  dealNextCard,

                  DEAL_GAP_MS

                );

            },

            DEAL_ANIMATION_MS

          );

      }

      dealNextCard();

    }

    function selectCard(index) {

      if (gameOver) return;

      if (inputLocked) return;

      const player =

        players[

          currentPlayerIndex

        ];

      if (

        player.type !== "HUMAN"

      ) {

        return;

      }

      openCard(

        index

      );

    }

    function openCard(index) {

      if (gameOver) return;

      if (inputLocked) return;

      if (

        cards[index].opened

      ) {

        return;

      }

      inputLocked =

        true;

      refreshBoard();

      playSound(

        cardFlickSound

      );

      flipTimer =

        setTimeout(

          () => {

            cards[index].opened =

              true;

            refreshBoard();

            if (

              cards[index].type

              === "DEAD"

            ) {

              pauseBgm();

              prepareDeadResult(

                players[

                  currentPlayerIndex

                ]

              );

              return;

            }

            nextTurn();

          },

          FLIP_DELAY_MS

        );

    }

    function prepareDeadResult(

      loser

    ) {

      gameOver =

        true;

      inputLocked =

        true;

      awaitingResult =

        true;

      pendingLoser =

        loser;

      clearTimeout(

        cpuTimer

      );

      status.textContent =

        `PLAYER ${loser.number} DIED`;

      gameInfo.textContent =

        "TAP SCREEN TO RESULT";

      refreshBoard();

      deadTapLayer

        .classList

        .add(

          "active"

        );

    }

    function nextTurn() {

      currentPlayerIndex++;

      if (

        currentPlayerIndex

        >= players.length

      ) {

        currentPlayerIndex =

          0;

      }

      updateTurn();

    }

    function updateTurn() {

      if (gameOver) return;

      const player =

        players[

          currentPlayerIndex

        ];

      if (

        player.type === "CPU"

      ) {

        status.textContent =

          `PLAYER ${player.number} CPU TURN`;

        inputLocked =

          true;

        refreshBoard();

        cpuTimer =

          setTimeout(

            cpuPlay,

            700

          );

      } else {

        status.textContent =

          `PLAYER ${player.number} TURN`;

        inputLocked =

          false;

        refreshBoard();

      }

      gameInfo.textContent =

        `${boardSize}×${boardSize} / DEAD ${deadCardCount}`;

    }

    function cpuPlay() {

      if (gameOver) return;

      const unopenedIndexes =

        cards

          .map(

            (

              card,

              index

            ) =>

              card.opened

                ? null

                : index

          )

          .filter(

            index =>

              index !== null

          );

      if (

        unopenedIndexes.length

        === 0

      ) {

        return;

      }

      const randomIndex =

        unopenedIndexes[

          Math.floor(

            Math.random()

            * unopenedIndexes.length

          )

        ];

      inputLocked =

        false;

      openCard(

        randomIndex

      );

    }

    function refreshBoard() {

      const buttons =

        board.querySelectorAll(

          ".card"

        );

      buttons.forEach(

        button => {

          const index =

            Number(

              button.dataset.index

            );

          const card =

            cards[index];

          button.innerHTML =

            "";

          const image =

            document.createElement(

              "img"

            );

          if (

            !card.opened

          ) {

            image.src =

              IMAGE_BACK;

            image.alt =

              "CARD BACK";

          } else if (

            card.type

            === "ALIVE"

          ) {

            image.src =

              IMAGE_ALIVE;

            image.alt =

              "ALIVE";

          } else {

            image.src =

              IMAGE_DEAD;

            image.alt =

              "DEAD";

          }

          button.appendChild(

            image

          );

          button.disabled =

            gameOver

            || inputLocked

            || card.opened;

        }

      );

    }

    function countBingo() {

      const lines =

        [];

      for (

        let row = 0;

        row < boardSize;

        row++

      ) {

        const line =

          [];

        for (

          let col = 0;

          col < boardSize;

          col++

        ) {

          line.push(

            row

            * boardSize

            + col

          );

        }

        lines.push(

          line

        );

      }

      for (

        let col = 0;

        col < boardSize;

        col++

      ) {

        const line =

          [];

        for (

          let row = 0;

          row < boardSize;

          row++

        ) {

          line.push(

            row

            * boardSize

            + col

          );

        }

        lines.push(

          line

        );

      }

      const diagonal1 =

        [];

      for (

        let i = 0;

        i < boardSize;

        i++

      ) {

        diagonal1.push(

          i

          * boardSize

          + i

        );

      }

      lines.push(

        diagonal1

      );

      const diagonal2 =

        [];

      for (

        let i = 0;

        i < boardSize;

        i++

      ) {

        diagonal2.push(

          i

          * boardSize

          + (

            boardSize

            - 1

            - i

          )

        );

      }

      lines.push(

        diagonal2

      );

      let bingoCount =

        0;

      lines.forEach(

        line => {

          const complete =

            line.every(

              index =>

                cards[index].opened

            );

          if (complete) {

            bingoCount++;

          }

        }

      );

      return bingoCount;

    }

    function finishGame(loser) {

      const bingo =

        countBingo();

      const shots =

        1 + bingo;

      resultTitle.textContent =

        `PLAYER ${loser.number} LOSE`;

      resultBingo.textContent =

        bingo;

      resultShots.textContent =

        shots;

      awaitingResult =

        false;

      pendingLoser =

        null;

      deadTapLayer

        .classList

        .remove(

          "active"

        );

      showScreen(

        resultScreen

      );

      startBgm();

    }

    deadTapLayer.addEventListener(

      "click",

      () => {

        if (

          !awaitingResult

          || !pendingLoser

        ) {

          return;

        }

        finishGame(

          pendingLoser

        );

      }

    );

    titleStartButton.addEventListener(

      "click",

      async () => {

        await resumeDealAudio();

        startBgm();

        showScreen(

          settingsScreen

        );

      }

    );

    backTitleButton.addEventListener(

      "click",

      () => {

        showScreen(

          titleScreen

        );

      }

    );

    gameStartButton.addEventListener(

      "click",

      startGameFromSettings

    );

    retryButton.addEventListener(

      "click",

      startGame

    );

    resultSettingsButton.addEventListener(

      "click",

      () => {

        showScreen(

          settingsScreen

        );

      }

    );

    boardSizeSelect.addEventListener(

      "change",

      updateDeadOptions

    );

    humanCountSelect.addEventListener(

      "change",

      () => {

        settingError.textContent =

          "";

      }

    );

    cpuCountSelect.addEventListener(

      "change",

      () => {

        settingError.textContent =

          "";

      }

    );

    updateDeadOptions();

    loadDealSound();

  </script>

</body>
