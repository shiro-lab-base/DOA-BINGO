<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <title>DOA TARGET GUESS</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: #fff;

      font-family: Arial, sans-serif;

      overflow-x: hidden;

    }

    button,

    select {

      font: inherit;

    }

    button {

      cursor: pointer;

    }

    .screen {

      display: none;

      width: 100%;

      min-height: 100vh;

    }

    .container {

    h1,

    h2 {

    }

    .main-button {

      width: 100%;

      font-weight: bold;

    }

    .secondary-button {

      width: 100%;

      min-height: 48px;

      margin-top: 12px;

      border: 1px solid #777;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-weight: bold;

    }

    .setting-box {

      margin-top: 28px;

      text-align: left;

    }

    .setting-box label {

      display: block;

      margin-bottom: 8px;

      color: #fff;

      font-weight: bold;

      text-shadow: 0 1px 3px #000;

    }

    .setting-box select {

      width: 100%;

      height: 50px;

      padding: 0 12px;

      border: 1px solid #666;

      border-radius: 8px;

      background: #1c1c1c;

      color: #fff;

    }

    #setupScreen {

      justify-content: center;

    }

    #setupCards {

      --setup-count: 5;

      display: flex;

      flex-wrap: nowrap;

      justify-content: center;

      align-items: flex-end;

      gap: 8px;

      width: 100%;

      margin-top: 28px;

      overflow-x: auto;

      padding: 8px 0 16px;

    }

    .setup-card {

      flex: 0 0 auto;

      width: min(

        90px,

        calc(

          (

            100vw

            - 52px

            - (

              (var(--setup-count) - 1)

              * 8px

            )

          )

          / var(--setup-count)

        )

      );

      min-width: 34px;

      aspect-ratio: 63 / 88;

      padding: 0;

      border: 2px solid transparent;

      border-radius: 8px;

      overflow: hidden;

      background: transparent;

      transition:

        transform 0.18s ease,

        border-color 0.18s ease;

    }

    .setup-card.selected {

      border-color: #d00000;

      transform: translateY(-7px);

    }

    .setup-card img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    .setup-actions {

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 10px;

    }

    .setup-actions button {

      border: 1px solid #777;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.72);

      color: #fff;

      font-weight: bold;

    }

    #blindStatus {

      min-height: 24px;

      margin-top: 8px;

      color: #ddd;

      font-size: 13px;

      letter-spacing: 1px;

    }

    #gameScreen {

      position: relative;

      justify-content: center;

      overflow: hidden;

    }

    /* DTG GAME BACKGROUND */

#gameScreen {

  background-image: url("../images/doa-tate-back.PNG");

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

}

@media (orientation: landscape) {

  #gameScreen {

    background-image: url("../images/doa-yoko-back.PNG");

  }

}
    
    .game-wrap {

      width: 100%;

      max-width: 1180px;

      position: relative;

      z-index: 3;

    }

    .player-label {

      margin: 4px 0 8px;

      font-size: 15px;

      font-weight: bold;

      letter-spacing: 2px;

      text-shadow: 0 1px 4px #000;

    }

    .card-row {

      display: flex;

      justify-content: center;

      gap: 8px;

      width: 100%;

      min-height: 130px;

      perspective: 900px;

    }

    .game-card {

  width: min(

    110px,

    calc(

      (

        100vw

        - 52px

        - (

          (var(--card-count) - 1)

          * 8px

        )

      )

      / var(--card-count)

    )

  );

  aspect-ratio: 63 / 88;

  padding: 0;

  border: 0;

  border-radius: 8px;

  overflow: hidden;

  background: transparent;

  transition:

    transform 0.38s ease,

    opacity 0.38s ease,

    filter 0.2s ease;

  transform-style: preserve-3d;

}

    .game-card img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    .game-card.selectable {

      outline: 2px solid rgba(255, 255, 255, 0.8);

      animation: cardPulse 0.8s ease-in-out infinite alternate;

    }

    @keyframes cardPulse {

      from {

        filter: brightness(1);

      }

      to {

        filter: brightness(1.45);

      }

    }

    .cpu-card.opened {

      transform:

        perspective(700px)

        rotateX(58deg)

        translateY(20px);

      transform-origin: bottom center;

    }
    .cpu-card.opened img {

  transform: rotate(180deg);

}
    .player-card.opened {

      transform:

        perspective(800px)

        translateY(-16px)

        rotateX(32deg);

      transform-origin: bottom center;

    }

    

/* DTG STANDING CARDS */

/* CPU：テーブル奥側 */

.cpu-card:not(.opened) {

  transform:

    perspective(900px)

    rotateX(-13deg);

  transform-origin: center bottom;

  box-shadow:

    0 9px 8px rgba(0, 0, 0, 0.5),

    0 18px 14px rgba(0, 0, 0, 0.3);

}

/* YOU：テーブル手前側 */

.player-card:not(.opened) {

  transform:

    perspective(900px)

    rotateX(-13deg);

  transform-origin: center bottom;

  box-shadow:

    0 8px 7px rgba(0, 0, 0, 0.5),

    0 15px 12px rgba(0, 0, 0, 0.3);

}
    
    .dice-zone {

      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: center;

      gap: 18px;

      margin: 18px auto;

      width: 100%;

      max-width: 760px;

      min-height: 150px;

    }

    .roll-result {

      display: flex;

      flex-direction: column;

      justify-content: center;

      min-height: 92px;

      padding: 12px;

      border: 1px solid rgba(255, 255, 255, 0.45);

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.55);

    }

    .roll-label {

      font-size: 12px;

      letter-spacing: 2px;

      color: #bbb;

    }

    .roll-number {

      margin-top: 5px;

      font-size: 42px;

      font-weight: bold;

    }

    .center-dice-area {

      display: flex;

      flex-direction: column;

      align-items: center;

      min-width: 140px;

    }

    #centerDice {

      position: relative;
      
      display: flex;

      align-items: center;

      justify-content: center;

      width: 92px;

      height: 92px;

      border: 3px solid #ddd;

      border-radius: 18px;

      background: #f7f3e8;

      color: #111;

      font-size: 52px;

      font-weight: bold;

      box-shadow:

        0 6px 14px rgba(0, 0, 0, 0.45),

        inset 0 0 12px rgba(0, 0, 0, 0.15);

    }

    #centerDice .pip {

  position: absolute;

  width: 17%;

  height: 17%;

  border-radius: 50%;

  background: #111;

  transform: translate(-50%, -50%);

}

#centerDice .pip.red {

  width: 23%;

  height: 23%;

  background: #c00000;

}
    
    #centerDice.rolling {

      animation: diceRoll 0.16s linear infinite;

    }

    @keyframes diceRoll {

      0% {

        transform: rotate(0deg) translateY(0);

      }

      25% {

        transform: rotate(90deg) translateY(-8px);

      }

      50% {

        transform: rotate(180deg) translateY(0);

      }

      75% {

        transform: rotate(270deg) translateY(-5px);

      }

      100% {

        transform: rotate(360deg) translateY(0);

      }

    }

    #rollButton {

      width: 140px;

      min-height: 44px;

      margin-top: 10px;

      border: 1px solid #fff;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);

      color: #fff;

      font-weight: bold;

    }

    #rollButton:disabled {

      opacity: 0.35;

      cursor: default;

    }

    #status {

      min-height: 32px;

      margin-top: 8px;

      font-size: 19px;

      font-weight: bold;

      letter-spacing: 1px;

      text-shadow: 0 1px 4px #000;

    }

    #dangerOverlay {

      position: absolute;

      inset: 0;

      z-index: 1;

      background: rgba(150, 0, 0, 0);

      pointer-events: none;

      transition: background 0.4s ease;

    }

    #dangerOverlay.active {

      background: rgba(150, 0, 0, 0.20);

    }

/* DTG ECG — continuous monitor */

#ecgLayer {

  display: none;

  position: absolute;

  inset: 0;

  z-index: 4;

  overflow: hidden;

  pointer-events: none;

}

#ecgLayer.active {

  display: block;

}

#ecgCanvas {

  display: block;

  width: 100%;

  height: 100%;

}
    
    #deadFxOverlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 5000;

      overflow: hidden;

      pointer-events: none;

    }

    #deadFxOverlay.active {

      display: block;

    }

    #deadFxRed {

      position: absolute;

      inset: 0;

      z-index: 1;

      background: rgba(150, 0, 0, 0.42);

      opacity: 0;

      transition:

        opacity 0.35s linear;

    }

    #deadFxRed.show {

      opacity: 1;

    }

    #deadFxCard {

      position: absolute;

      z-index: 2;

      object-fit: cover;

      border-radius: 8px;

      transition:

        left 0.7s ease-out,

        top 0.7s ease-out,

        width 0.7s ease-out,

        height 0.7s ease-out,

        transform 0.7s ease-out;

    }

    #deadFxBullet {

      position: absolute;

      z-index: 3;

      width: 140vmax;

height: 140vmax;

object-fit: contain;

      opacity: 0;

      transform:

        translate(-50%, -50%)

        scale(0.7);

      transition:

        opacity 0.08s linear,

        transform 0.12s ease-out;

    }

    #deadFxBullet.show {

      opacity: 1;

      transform:

        translate(-50%, -50%)

        scale(1);

    }

    #deadFxResultText {

      position: absolute;

      left: 50%;

      top: 50%;

      z-index: 4;

      transform:

        translate(-50%, -50%)

        scale(0.8);

      opacity: 0;

      font-size: clamp(64px, 13vw, 150px);

      font-weight: 900;

      letter-spacing: 8px;

      color: #fff;

      -webkit-text-stroke: 2px #000;

      text-shadow:

        0 0 3px #000,

        0 0 10px rgba(0, 0, 0, 0.9);

      transition:

        opacity 0.22s ease,

        transform 0.22s ease;

    }

    #deadFxResultText.show {

      opacity: 1;

      transform:

        translate(-50%, -50%)

        scale(1);

    }

    #deadFxResultText.lose {

      color: #d00000;

    }

    #deadFxResultText.win {

      color: #fff;

    }

    

/* DEAD / WIN RESULT LOGOS */

#deadFxResultText {

  width: 100vw;

  display: flex;

  justify-content: center;

  align-items: center;

  pointer-events: none;

}

#deadFxResultText img {

  display: block;

  width: 90vw;

  max-height: 44svh;

  height: auto;

  object-fit: contain;

  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));

}

#deadFxResultText.lose img {

  flex: 0 0 auto;

}

@media (orientation: landscape) {

    max-height: 60svh;

  }

  #deadFxResultText.lose img {

  max-height: 85svh;

}

}

/* DTG LANDSCAPE DICE UI */

@media (orientation: landscape) {

  .dice-zone {

    width: fit-content;

    max-width: 100%;

    grid-template-columns: auto auto auto;

    gap: clamp(8px, 1.5vw, 16px);

  }

  .roll-result {

    width: 110px;

  }

}

/* DTG PORTRAIT DICE UI */

@media (orientation: portrait) {

  .dice-zone {

    width: fit-content;

    max-width: 100%;

    grid-template-columns: auto auto auto;

    gap: 8px;

  }

  .roll-result {

    width: 74px;

    padding: 8px;

  }

}

/* DTG DICE RESULT NUMBER ALIGN */

.roll-number {

  text-align: center;

}
  
/* VS standalone background — shared repository image */
#settingsScreen, #setupScreen, #gameScreen.vs-mode, #resultScreen {
  background-image: url("../images/doa-vs-back.PNG");
  background-position: center;
  background-size: cover;
}
/* VS MODE: top seat faces the opposite player */
#gameScreen.vs-mode .game-wrap { width: 100%; }
#gameScreen.vs-mode .vs-top-seat { transform: rotate(180deg); }
#gameScreen.vs-mode .vs-top-seat .cpu-card.opened img { transform: none; }
#gameScreen.vs-mode .vs-top-seat .cpu-card:not(.opened) { transform: none; }
#gameScreen.vs-mode .player-card:not(.opened) { transform: none; }
#gameScreen.vs-mode .game-wrap { display:flex; flex-direction:column; justify-content:space-between; min-height: min(88svh, 900px); }
#gameScreen.vs-mode .card-row { min-height: 0; }
#gameScreen.vs-mode .dice-zone { margin: 12px auto; }
#gameScreen.vs-mode .game-card { width:min(110px, calc((100vw - 52px - (var(--card-count) - 1)*8px)/var(--card-count))); }
#gameScreen.vs-mode .vs-bottom-seat { text-align:center; }
#gameScreen.vs-mode .vs-top-seat { text-align:center; }
#gameScreen.vs-mode .landscape-note { display:none; }
#handoffScreen { justify-content:center; background:#000; text-align:center; }
#handoffScreen .container { max-width:500px; }
#handoffText { font-size: clamp(24px,6vw,40px); letter-spacing:2px; }
#handoffScreen .main-button { margin-top:35px; }
@media (orientation: landscape) {
  #gameScreen.vs-mode .game-wrap { min-height:0; height:100%; }
}
  
/* DTG VS - TWO INDEPENDENT ROLL CONTROLS */

#gameScreen:is(.vs-mode, .online-mode) .dice-zone {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  width: 100%;

  min-height: 0;

  gap: 10px;

  margin: 12px auto;

}

/* Independent player controls */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row {

  position: relative;

  width: 268px;

  height: 84px;

  flex: none;

}

/* P2 faces the opposite direction */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row.p2-row {

  transform: rotate(180deg);

}

/* Result UI */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row .roll-result {

  position: absolute;

  top: 0;

  left: 79px;

  width: 110px;

  min-height: 76px;

  padding: 8px;

  text-align: center;

}

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row .roll-number {

  font-size: 32px;

}

/* ROLL button to the right of each result */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row .vs-roll-button {

  position: absolute;

  top: 9px;

  left: 199px;

  width: 66px;

  height: 58px;

  margin: 0;

  padding: 0 4px;

  border: 1px solid #fff;

  border-radius: 8px;

  background: rgba(0, 0, 0, 0.70);

  color: #fff;

  font-size: 13px;

  font-weight: bold;

  cursor: pointer;

}

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-button:disabled {

  opacity: 0.35;

  cursor: default;

}

/* Shared central dice */

#gameScreen:is(.vs-mode, .online-mode) .center-dice-area {

  display: flex;

  align-items: center;

  justify-content: center;

  min-width: 0;

  width: 100%;

}

#gameScreen:is(.vs-mode, .online-mode) #centerDice {

  flex: none;

}
 
/* DTG VS - OPENED CARDS FLAT */

#gameScreen.vs-mode .game-card.opened {

  transform: none;

}

/* DTG VS - PLAYER 2 LOSE EFFECT */

#deadFxOverlay.p2-loss {

  transform: rotate(180deg);

  transform-origin: center center;

}   
  
/* DTG VS - P2 RESULT ROTATION */

#resultScreen.p2-lose .result-box {

  transform: rotate(180deg);

  transform-origin: center center;

}    

/* CPU BATTLE dice display */

#gameScreen:not(.vs-mode):not(.online-mode) .dice-zone {

  display: grid;

  grid-template-columns:

    minmax(0, 1fr) auto minmax(0, 1fr);

  align-items: center;

  width: 100%;

  max-width: 760px;

}

#gameScreen:not(.vs-mode):not(.online-mode) .vs-roll-row {

  position: static;

  width: auto;

  height: auto;

  transform: none;

}

#gameScreen:not(.vs-mode):not(.online-mode) .vs-roll-row.p1-row {

  grid-column: 1;

  grid-row: 1;

}

    function randomDice() {

   function renderDiceFace(value) {

  const positions = {

    1: [[50, 50]],

    2: [[25, 25], [75, 75]],

    3: [[25, 25], [50, 50], [75, 75]],

    4: [[25, 25], [75, 25], [25, 75], [75, 75]],

    5: [[25, 25], [75, 25], [50, 50], [25, 75], [75, 75]],

    6: [[25, 22], [75, 22], [25, 50], [75, 50], [25, 78], [75, 78]]

  };

  centerDice.innerHTML = "";

  const dots = positions[value] || positions[1];

  dots.forEach(([x, y]) => {

    const pip = document.createElement("span");

    pip.className =

      value === 1 ? "pip red" : "pip";

    pip.style.left = `${x}%`;

    pip.style.top = `${y}%`;

    centerDice.appendChild(pip);

  });

}

  finalValue

playSound(diceRollSound);

    Date.now();

    - start

    < 700

    await wait(

    .classList

}

async function rollRound() {

  if (gameMode !== "CPU" || rolling || gameOver) return;

  rolling = true;

  rollButton.disabled = true;

  clearCpuSelection();

  playerRollDisplay.textContent = "-";

  cpuRollDisplay.textContent = "-";

  playerRoll = 0;

  cpuRoll = 0;

  for (let i = 1; i <= diceRollCount; i++) {

    status.textContent = diceRollCount === 1

      ? "YOU ROLL"

      : `YOU ROLL ${i}/2`;

    renderDiceFace(1);

    const roll = randomDice();

    await animateDice(roll);

    playerRoll += roll;

    playerRollDisplay.textContent = playerRoll;

    if (i < diceRollCount) await wait(550);

  }

  await wait(600);

  for (let i = 1; i <= diceRollCount; i++) {

    status.textContent = diceRollCount === 1

      ? "CPU ROLL"

      : `CPU ROLL ${i}/2`;

    renderDiceFace(1);

    const roll = randomDice();

    await animateDice(roll);

    cpuRoll += roll;

    cpuRollDisplay.textContent = cpuRoll;

    if (i < diceRollCount) await wait(550);

  }

  await wait(500);

  if (playerRoll === cpuRoll) {

    status.textContent = "DRAW - ROLL AGAIN";

    rolling = false;

    rollButton.disabled = false;

    return;

  }

  if (playerRoll > cpuRoll) {

    status.textContent = "CHOOSE CPU CARD";

    rolling = false;

    enableCpuSelection();

    return;

  }

  status.textContent = "CPU CHOOSES";

  // V34: last-card danger continues until a DEAD card is revealed.

  await wait(650);

  cpuChoosePlayerCard();

  rolling = false;

}
    
function updateVsRollButtons() {

}

  playerRoll = 0;

  cpuRoll = 0;

}

async function rollForPlayer(playerNumber) {

  if (gameOver || rolling || rollPhase !== "rolling") return;

  const isP1 = playerNumber === 1;

  if (isP1 ? p1RollsDone >= diceRollCount : p2RollsDone >= diceRollCount) {

    return;

  }

  rolling = true;

  updateVsRollButtons();

  clearCpuSelection();

  clearPlayerSelection();

  const nextRoll = (isP1 ? p1RollsDone : p2RollsDone) + 1;

  status.textContent = diceRollCount === 1

    ? `PLAYER ${playerNumber} ROLL`

    : `PLAYER ${playerNumber} ROLL ${nextRoll}/${diceRollCount}`;

  renderDiceFace(1);

  const value = randomDice();

  await animateDice(value);

  if (isP1) {

    playerRoll += value;

    p1RollsDone++;

    playerRollDisplay.textContent = String(playerRoll);

  } else {

    cpuRoll += value;

    p2RollsDone++;

    cpuRollDisplay.textContent = String(cpuRoll);

  }

  const p1Finished = p1RollsDone >= diceRollCount;

  const p2Finished = p2RollsDone >= diceRollCount;

  if (p1Finished && p2Finished) {

    rollPhase = "choosing";

    updateVsRollButtons();

    await wait(500);

    if (playerRoll === cpuRoll) {

      status.textContent = "DRAW - ROLL AGAIN";

      await wait(550);

      resetVsRollTurn();

      return;

    }

    rolling = false;

    updateVsRollButtons();

    if (playerRoll > cpuRoll) {

      status.textContent = "PLAYER 1: CHOOSE P2 CARD";

      enableCpuSelection();

    } else {

      status.textContent = "PLAYER 2: CHOOSE P1 CARD";

      enablePlayerSelection();

    }

    return;

  }

  rolling = false;

  status.textContent = "ROLL THE DICE";

  updateVsRollButtons();

}

const ecgCanvas = document.getElementById("ecgCanvas");

const ecgCtx = ecgCanvas.getContext("2d");

let ecgAnimationFrame = null;

let ecgLastFrame = 0;

let ecgScroll = 0;

let ecgPulseStart = -1000;

let ecgPulsePower = 0;

function ecgVariation(index) {

  const v = Math.sin(index * 127.1 + 19.19) * 43758.5453;

  return v - Math.floor(v);

}

function ecgNormalWave(position) {

  const beat = Math.floor(position / 92);

  const phase = ((position % 92) + 92) % 92;

  const scale = 0.65 + ecgVariation(beat) * 0.6;

  const points = [

    [0, 0], [15, 0], [22, -4], [28, 0],

    [38, 0], [43, 5], [48, -17], [53, 19],

    [59, 0], [92, 0]

  ];

  for (let i = 1; i < points.length; i++) {

    if (phase <= points[i][0]) {

      const [x0, y0] = points[i - 1];

      const [x1, y1] = points[i];

      return (

        y0 + (y1 - y0) *

        (phase - x0) / (x1 - x0)

      ) * scale;

    }

  }

  return 0;

}

function ecgCenterWave(dx) {

  const points = [

    [-90, 0], [-60, 0], [-35, -0.06],

    [-21, 0.10], [-10, -0.18],

    [0, -1], [17, 1], [32, 0], [90, 0]

  ];

  if (dx < -90 || dx > 90) return 0;

  for (let i = 1; i < points.length; i++) {

    if (dx <= points[i][0]) {

      const [x0, y0] = points[i - 1];

      const [x1, y1] = points[i];

      return y0 + (y1 - y0) *

        (dx - x0) / (x1 - x0);

    }

  }

  return 0;

}

function drawEcg(now) {

  if (!dangerMode || gameOver) {

    ecgAnimationFrame = null;

    return;

  }

  const elapsed = ecgLastFrame

    ? Math.min(now - ecgLastFrame, 50)

    : 0;

  ecgLastFrame = now;

  ecgScroll += elapsed * 0.09;

  const bounds = ecgCanvas.getBoundingClientRect();

  const w = bounds.width;

  const h = bounds.height;

  if (w && h) {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const pw = Math.round(w * dpr);

    const ph = Math.round(h * dpr);

    if (ecgCanvas.width !== pw || ecgCanvas.height !== ph) {

      ecgCanvas.width = pw;

      ecgCanvas.height = ph;

    }

    ecgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ecgCtx.clearRect(0, 0, w, h);

    const age = now - ecgPulseStart;

    const envelope = age >= 0 && age < 280

      ? Math.pow(Math.sin(Math.PI * age / 280), 0.75)

      : 0;

    const strength = ecgPulsePower * envelope;

    const bigAmplitude = Math.min(h * 0.38, 260);

    for (let x = 0; x <= w + 2; x += 2) {

      const nearCenter = Math.max(0, 1 - Math.abs(dx) / 90);

      const weight = strength * nearCenter;

      const y = h / 2

        + normal * (1 - weight)

        + ecgCenterWave(dx) * bigAmplitude * strength;

      if (x === 0) ecgCtx.moveTo(x, y);

    ecgCtx.lineWidth = 2.5;

  let time = onlineClock ? onlineClock.time : heartbeatSound.currentTime;

    if (time !== guestEcgAudioTime) {
      guestEcgAudioTime = time;
      guestEcgClockAt = now;
    } else {
      const duration = onlineClock ? onlineClock.duration : heartbeatSound.duration;
      const cycle = Number.isFinite(duration) && duration > 16.27 ? duration : 17.2;
      time = (guestEcgAudioTime + Math.max(0, now - guestEcgClockAt) / 1000) % cycle;
    }

  if (time < previousHeartbeatTime - 0.5) {

    heartbeatIndex = 0;

    heartbeatIndex < heartbeatTimes.length &&

function dtgCreateInput(parent, placeholder, level = 0) {

  const input = document.createElement("input");

  input.type = "text";

  input.maxLength = 120;

  input.placeholder = placeholder;

  input.dataset.level = String(level);

  input.style.cssText = "display:block;width:100%;min-height:44px;margin:7px 0;padding:9px 12px;border:1px solid #666;border-radius:7px;background:#1c1c1c;color:#fff;font:inherit";

  parent.appendChild(input);

}

  dtgCreateInput(dtgRandomInputs, `PENALTY ${i}`);

}

for (let level = 1; level <= 5; level++) {

  const heading = document.createElement("h3");

  const [min, max] = dtgPenaltyRanges[level - 1];

  heading.textContent = `LEVEL ${level}（${min}${min === max ? "" : "〜" + max}）`;

  dtgLevelInputs.appendChild(heading);

  for (let i = 1; i <= 3; i++) {

    dtgCreateInput(dtgLevelInputs, `LEVEL ${level} - ${i}`, level);

  }

}

function dtgUpdatePenaltyUI() {

  const mode = dtgPenaltyType.value;

  const drink = mode === "SHOT" || mode === "IKKI";

  dtgDeadBox.hidden = !drink;

  dtgOpenedBox.hidden = !drink;

  dtgRandomSettings.hidden = mode !== "RANDOM";

  dtgLevelSettings.hidden = mode !== "LEVEL";

  dtgPenaltyError.textContent = "";

}

dtgPenaltyType.addEventListener("change", dtgUpdatePenaltyUI);

function dtgInputValues(container) {

  return Array.from(

    container.querySelectorAll("input"),

    input => input.value.trim()

  );

}

function dtgPenaltySnapshot() {

  return {

    mode: dtgPenaltyType.value,

    randomDead: document.getElementById("dtgRandomDead").value,

    random: dtgInputValues(dtgRandomInputs),

    level: dtgInputValues(dtgLevelInputs)

  };

}

function dtgLoadPenaltySnapshot() {

  try {

    const saved = JSON.parse(

      sessionStorage.getItem(dtgPenaltyStorageKey) || "null"

    );

    if (!saved) return;

    if (["SHOT", "IKKI", "RANDOM", "LEVEL"].includes(saved.mode)) {

      dtgPenaltyType.value = saved.mode;

    }

    if (["1", "2", "3"].includes(saved.randomDead)) {

      document.getElementById("dtgRandomDead").value = saved.randomDead;

    }

    [dtgRandomInputs, dtgLevelInputs].forEach((container, index) => {

      const source = index === 0 ? saved.random : saved.level;

      if (!Array.isArray(source)) return;

      container.querySelectorAll("input").forEach((input, i) => {

        input.value = typeof source[i] === "string"

          ? source[i].slice(0, 120) : "";

      });

    });

  } catch (error) {

    console.warn("DTG penalty settings could not be restored", error);

  }

}

setupStartButton.addEventListener("click", event => {

  const settings = dtgPenaltySnapshot();

  const pool = settings.random.filter(Boolean);

  if (settings.mode === "RANDOM" && pool.length === 0) {

    dtgPenaltyError.textContent =

      "RANDOM PENALTYは最低1種類入力してください。";

  } else if (settings.mode === "LEVEL") {

    const maxCount = Number(aliveCountSelect.value) + 1;

    const maxLevel = dtgPenaltyRanges.findIndex(

      ([min, max]) => maxCount <= max

    ) + 1;

    const missing = Array.from(

      { length: maxLevel }, (_, i) => i

    ).find(

      i => !settings.level.slice(i * 3, i * 3 + 3).some(Boolean)

    );

    dtgPenaltyError.textContent = missing === undefined

      ? ""

      : `LEVEL ${missing + 1}の罰ゲームを最低1種類入力してください。`;

  } else {

    dtgPenaltyError.textContent = "";

  }

  if (dtgPenaltyError.textContent) {

    event.preventDefault();

    event.stopImmediatePropagation();

    return;

  }

  try {

    sessionStorage.setItem(

      dtgPenaltyStorageKey,

      JSON.stringify(settings)

    );

  } catch (error) {

    console.warn("DTG penalty settings could not be saved", error);

  }

}, true);

function dtgDrawPenalty(pool) {

  return pool[Math.floor(Math.random() * pool.length)];

}

function renderDtgPenalty(openedBonus, loser) {

  const settings = dtgPenaltySnapshot();

  const dead = Number(document.getElementById("deadPenalty").value);

  const opened = Number(document.getElementById("openedPenalty").value);

  resultDetail.style.whiteSpace = "pre-line";

  if (settings.mode === "RANDOM") {

    const count = Number(settings.randomDead) + openedBonus; 

    const pool = settings.random.filter(Boolean);

    resultPenalty.textContent = "RANDOM PENALTY";

    resultDetail.textContent = `TOTAL：${count}\n`

      + Array.from(

          { length: count },

          (_, i) => `${i + 1}. ${dtgDrawPenalty(pool)}`

        ).join("\n")

      + `\nLOSER：${loser}`;

  } else if (settings.mode === "LEVEL") {

    const count = 1 + openedBonus;

    const level = dtgPenaltyRanges.findIndex(

      ([min, max]) => count >= min && count <= max

    ) + 1;

    const pool = settings.level

      .slice((level - 1) * 3, level * 3)

      .filter(Boolean);

    resultPenalty.textContent = `LEVEL ${level}（${count}）`;

    resultDetail.textContent =

      `${dtgDrawPenalty(pool)}\nLOSER：${loser}`;

  } else {

    const count = dead + openedBonus * opened;

    resultPenalty.textContent = settings.mode === "IKKI"

      ? `${count} IKKI`

      : `${count} SHOT${count === 1 ? "" : "S"}`;

    resultDetail.textContent =

      `DEAD：${dead}\nOPENED：${openedBonus} × ${opened}\nLOSER：${loser}`;

  }

}

        detail.innerHTML=`<h3>ROOM DETAILS</h3><p><strong>ROOM ID</strong>：${escapeHtml(r.roomId)}<br><strong>HOST NAME</strong>：${escapeHtml(r.hostName)}</p>${lobbyRules(r.rules)}<label for="onlinePlayerName">PLAYER NAME（任意）</label><input id="onlinePlayerName" maxlength="20" autocomplete="nickname" placeholder="GUEST"><div ${r.locked?'':'hidden'}><label for="onlinePassword">ROOM PASSWORD</label><input id="onlinePassword" maxlength="64" type="text" autocomplete="off"></div><p id="guestDetailMessage" role="status"></p>`;
        byId('onlinePlayerName').value=localStorage.getItem(nameKey)||'';
        detail.scrollTop=0;join.disabled=false;fitGuestPaperText();
      }catch(e){if(active()&&seq===detailRequest){detail.innerHTML=`<p>${escapeHtml(e.message)}</p>`;fitGuestPaperText();}}
    }
    byId('guestSearch').onsubmit=async e=>{
      e.preventDefault();const id=search.value.trim().toUpperCase();
      if(!valid(id)){say('ROOM IDを確認してください');return;}
      const seq=++request;say('');
      try{const r=await api('roomInfo',{roomId:id});if(!active()||seq!==request)return;
        const existing=visible.findIndex(x=>x.roomId===id);
        if(existing>=0)visible[existing]=r;else if(visible.length<6)visible.push(r);else visible[5]=r;
        render();
      }catch(e){if(active()&&seq===request)say(e.message);}
    };
    byId('onlineBack').onclick=entryMenu;
    byId('onlineRefresh').onclick=fetchRooms;
    byId('guestDetailBack').onclick=()=>{if(joining)return;++detailRequest;selected=null;overlay.hidden=true;join.disabled=true;};
    join.onclick=async()=>{
      if(!selected||joining)return;
      const name=getName()||'GUEST',roomId=selected.roomId,password=byId('onlinePassword').value;
      if(!valid(roomId)){say('部屋を選択してください');return;}
      joining=true;join.disabled=true;
      try{
        const r=await api('join',{name,roomId,password});
        identity={roomId:r.roomId,token:r.token,role:'guest'};saveName(name);saveIdentity();beginPolling();await receive(r.state);
      }catch(e){if(active()){byId('guestDetailMessage').textContent=e.message;join.disabled=false;fitGuestPaperText();}}
      finally{joining=false;}
    };
    await fetchRooms();
  }
  function lobbyRules(r){
    const p=r.penalty;
    const line=(label,value)=>`<p><strong>${escapeHtml(label)}</strong>：${escapeHtml(value)}</p>`;
    let details=line('ALIVE CARDS',r.alive)+line('DEAD CARD',1)+line('DICE MODE',`${r.rolls} ROLL`)+line('PENALTY TYPE',p.mode);
    if(p.mode==='RANDOM'){
      details+=line('DEAD CARD（抽選回数）',p.randomDead)+line('PER OPENED CARD（抽選回数）',1);
      details+=p.random.filter(Boolean).map((v,i)=>line(`PENALTY ${i+1}`,v)).join('');
    }else if(p.mode==='LEVEL'){
      details+=line('LEVEL判定','DEAD 1 ＋ 勝者側の開封枚数');
      dtgPenaltyRanges.forEach(([min,max],i)=>{
        if(min>r.alive+1)return;
        details+=line(`LEVEL ${i+1}（${min===max?min:min+'〜'+max}）`,p.level.slice(i*3,i*3+3).filter(Boolean).join(' / '));
      });
    }else{
      details+=line('DEAD CARD',`${r.deadPenalty} ${p.mode}`)+line('PER OPENED CARD',`${r.openedPenalty} ${p.mode}`);
    }
    const rows=(details.match(/<p><strong>.*?<\/strong>：.*?<\/p>/g)||[]).map(line=>{
      const m=line.match(/<p><strong>(.*?)<\/strong>：(.*?)<\/p>/);
      return m?`<div class="rule-row"><strong>${m[1]}</strong><span>${m[2]}</span></div>`:'';
    }).join('');
    return `<div class="details-card"><h3>ROOM DETAILS</h3><div class="rule-sheet">${rows}</div></div>`;
  }

  function fitHostWaitingBoard() {
    const board=byId('hostWaitBoard');
    if(!board || !board.clientWidth || !onlineScreen.classList.contains('active'))return;
    for(const selector of ['.host-card-copy','.host-roomdata']){
      const area=board.querySelector(selector);
      const names=Array.from(area.querySelectorAll('.meta-row span'));
      names.forEach(el=>el.style.removeProperty('font-size'));
      const max=board.clientWidth*.03;
      const fits=()=>area.scrollHeight<=area.clientHeight && area.scrollWidth<=area.clientWidth &&
        Array.from(area.querySelectorAll('.host-card-line,.rule-row')).every(el=>el.scrollWidth<=el.clientWidth);
      let low=0.25,high=max;
      area.style.fontSize=high+'px';
      if(!fits()){
        for(let i=0;i<16;i++){
          const mid=(low+high)/2;
          area.style.fontSize=mid+'px';
          if(fits())low=mid;else high=mid;
        }
        area.style.fontSize=low+'px';
      }
      for(const el of names){
        let lo=0,hi=parseFloat(getComputedStyle(el).fontSize);
        if(el.scrollWidth<=el.clientWidth)continue;
        for(let i=0;i<16;i++){
          const mid=(lo+hi)/2;
          el.style.fontSize=mid+'px';
          if(el.scrollWidth<=el.clientWidth)lo=mid;else hi=mid;
        }
        el.style.fontSize=lo+'px';
      }
    }
  }
  window.addEventListener('resize',fitHostWaitingBoard);
  function hostWaitingRows(r) {
    const html=lobbyRules(r);
    const m=html.match(/<div class="rule-sheet">([\s\S]*?)<\/div><\/div>$/);
    return m?m[1]:'';
  }

  function lobby(s) {
    const host=identity.role==='host';
    const guest=s.guestPresent ? s.seats[1].name : 'WAITING...';
    const guestReady=s.guestLobbyReady===true;
    const signature=JSON.stringify([s.phase,s.guestPresent,s.seats.map(x=>x.name),host,guestReady]);
    if(onlineContents.dataset.signature===signature&&onlineScreen.classList.contains('active'))return;
    if(s.phase==='guest_left'){
      if(host) {
        showOnline('<div class="board-stack"><div class="board-paper"><div class="paper-kicker">ROOM NOTICE</div><h2 class="board-title">GUEST LEFT</h2><p class="paper-text">ゲストが退出しました。</p></div><div class="board-actions"><button id="onlineHostBack" class="main-button">BACK</button></div></div>');
        byId('onlineHostBack').onclick=leave;
      }else exitLocal('部屋から退出しました');
      return;
    }
    {
      const roomDataRows=hostWaitingRows(s.rules);
      const waitLabel=!s.guestPresent?'WAITING':guestReady?'READY':'CHECKING';
      const stampPress=!byId('hostWaitBoard') || !onlineContents.querySelector('.host-ready-stamp');
      const readyStamp=s.guestPresent&&guestReady?`<svg class="host-ready-stamp${stampPress?' stamp-press':''}" viewBox="0 0 220 76" aria-label="READY" role="img"><defs><pattern id="hostReadyInkPattern" width="13" height="11" patternUnits="userSpaceOnUse"><rect width="13" height="11" fill="white"/><path d="M2 1l1 .7M8 5l1.5 .4M4 9l.8 -.7M12 2l.3 1.2" stroke="black" stroke-width=".65" stroke-linecap="round"/></pattern><mask id="hostReadyInkMask"><rect width="220" height="76" fill="url(#hostReadyInkPattern)"/></mask></defs><g mask="url(#hostReadyInkMask)" stroke="#a0251c"><rect x="5" y="5" width="210" height="66" rx="3" fill="none" stroke-width="4"/><rect x="11" y="11" width="198" height="54" rx="1" fill="none" stroke-width="1.2"/><text x="110" y="54" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="44" letter-spacing="5" fill="#a0251c" stroke="none">READY</text></g></svg>`:'';
      showOnline(`<div id="hostWaitBoard"><div class="host-card-copy"><div class="host-card-line kicker">MATCH REGISTRATION</div><div class="host-card-line title">WAITING ROOM</div><div class="host-card-line roomid">ROOM ID : ${escapeHtml(s.roomId)}</div><div class="host-card-line meta-row"><span>NAME : ${escapeHtml(host?s.seats[0].name:guest)}</span><span>OPPONENT : ${escapeHtml(host?guest:s.seats[0].name)}</span></div><div class="host-card-line status">${waitLabel}</div></div><div class="host-roomdata-title">ROOM DATA</div><div class="host-roomdata"><div class="rule-sheet">${roomDataRows}</div></div>${readyStamp}${host?'<button id="onlineStart" type="button">SET DEAD</button><button id="onlineKick" type="button">KICK GUEST</button>':`<button id="onlineLobbyReady" type="button">${guestReady?'CANCEL READY':'READY'}</button>`}<button id="onlineLeave" type="button">BACK</button></div>`);
      onlineContents.dataset.signature=signature;
      if(host){
      byId('onlineStart').disabled=!s.guestPresent||!guestReady;
      byId('onlineStart').onclick=()=>action('start');
      byId('onlineKick').hidden=!s.guestPresent;byId('onlineKick').onclick=()=>action('kick');
      }else byId('onlineLobbyReady').onclick=()=>action('lobbyReady',{ready:!guestReady});
      byId('onlineLeave').onclick=leave;
      fitHostWaitingBoard();
      return;
    }
  }
  function setup(s) {
    const own=mySeat(s),opp=theirSeat(s);
    const key=`${s.roomId}:${s.match}`;
    if(lastSetup!==key){
      cleanEffects(true);if(bgm.paused)startBgm();aliveCount=s.rules.alive;totalCards=aliveCount+1;diceRollCount=s.rules.rolls;
      setupTitle.textContent='SET YOUR DEAD';buildSetupCards();
      if(own.ready){
        blindMode=!!own.blind;
        if(Number.isInteger(own.deadIndex))selectedDeadIndex=own.deadIndex;
        blindStatus.textContent=blindMode?'DEAD LOCATION HIDDEN':'';renderSetupCards();
      }
      lastSetup=key;lastGame='';lastBoard='';lastResult='';
    }
    showScreen(setupScreen);lockOfflineScreens(true);
    confirmSetupButton.disabled=own.ready;
    confirmSetupButton.textContent=own.ready?'READY ✓':'SET / READY';
    onlineKickSetup.hidden=identity.role!=='host'||!s.guestPresent||opp.ready;
    onlineLeaveSetup.hidden=false;onlineLeaveGame.hidden=true;onlineLeaveResult.hidden=true;
    onlineIndicator.hidden=false;
    onlineIndicator.textContent=own.ready ? (opp.ready?'STARTING...':'READY — WAIT FOR OPPONENT') : `ROOM ${s.roomId} — SET YOUR DEAD`;
  }
  function syncModel(s){
    aliveCount=s.rules.alive;totalCards=aliveCount+1;diceRollCount=s.rules.rolls;
    const mine=mySeat(s),opp=theirSeat(s),idx=myIndex();
    const from=(p,own)=>Array.from({length:totalCards},(_,i)=>{
      const revealed=p.opened.find(x=>x.index===i);
      return {type:revealed?.type||(own&&p.deadIndex===i?'DEAD':'ALIVE'),opened:!!revealed};
    });
    playerDeck=from(mine,true);cpuDeck=from(opp,false);
    blindMode=!!mine.blind;
    playerOpenedCount=mine.opened.length;cpuOpenedCount=opp.opened.length;
    playerRoll=s.totals[idx];cpuRoll=s.totals[1-idx];
  }
  function board(s,force=false) {
    syncModel(s);
    const mine=mySeat(s),opp=theirSeat(s),idx=myIndex();
    const key=JSON.stringify([s.match,s.seats.map(p=>p.opened),mine.deadIndex,mine.blind]);
    if(force||key!==lastBoard){
      renderGameCards();lastBoard=key;
    }
    topPlayerLabel.textContent=opp.name||'OPPONENT';bottomPlayerLabel.textContent=mine.name||'YOU';
    leftRollLabel.textContent='YOU';rightRollLabel.textContent='OPPONENT';
    playerRollDisplay.textContent=s.rollsDone[idx]?String(s.totals[idx]):'-';
    cpuRollDisplay.textContent=s.rollsDone[1-idx]?String(s.totals[1-idx]):'-';
    const active=s.phase==='game',myTurn=s.turn===identity.role;
    p1RollButton.disabled=!active||s.turn!==null||s.rollsDone[idx]>=s.rules.rolls||busy||animating;
    p2RollButton.disabled=true;
    rollButton.disabled=true;
    const prompt=!active?'MATCH ENDED':s.turn===null?(s.rollsDone[idx]<s.rules.rolls?'ROLL THE DICE':'WAIT FOR OPPONENT ROLL'):(myTurn?'CHOOSE OPPONENT CARD':'OPPONENT CHOOSES');
    status.textContent=prompt;
    cpuCards.querySelectorAll('.game-card').forEach(card=>{
      const index=Number(card.dataset.index),chosen=cpuDeck[index];
      const selectable=active&&myTurn&&!chosen.opened&&!busy&&!animating;
      card.classList.toggle('selectable',selectable);
      card.disabled=!selectable;
    });
    if(active){
      const danger=mine.opened.length===s.rules.alive && !mine.opened.some(x=>x.type==='DEAD');
      if(danger&&!dangerMode)startDangerMode(true);
      if(!danger&&dangerMode)stopDangerMode();
    }
    onlineIndicator.hidden=false;
    onlineIndicator.textContent=`${s.roomId} / ${identity.role.toUpperCase()} / ROUND ${s.round}`;
    onlineLeaveGame.hidden=false;onlineLeaveSetup.hidden=true;onlineKickSetup.hidden=true;onlineLeaveResult.hidden=true;
  }
  function beginGame(s,force=false){
    const key=s.roomId+':'+s.match;
    if(lastGame!==key){
      lastGame=key;lastBoard='';gameOver=false;rolling=false;dangerMode=false;
      stopDangerAudio();stopEcgCanvas();resetDeadEffect();dangerOverlay.classList.remove('active');ecgLayer.classList.remove('active');
      renderDiceFace(s.lastRoll?.value||1);if(bgm.paused)startBgm();
    }
    showScreen(gameScreen);lockOfflineScreens(true);board(s,force);
  }
  function showResult(s){
    const key=s.roomId+':'+s.match;
    if(lastResult!==key){stopDangerAudio();stopEcgCanvas();dangerMode=false;lastResult=key;}
    const win=s.winner===identity.role,r=s.result,pen=s.rules.penalty;
    resultTitle.textContent=win?'YOU WIN':'YOU LOSE';
    resultTitle.style.color=win?'#fff':'#d00000';
    resultScreen.classList.remove('p2-lose');
    resultScreen.classList.toggle('online-win',win);
    resultScreen.classList.toggle('online-lose',!win);
    if(pen.mode==='RANDOM'){
      resultPenalty.textContent='RANDOM PENALTY';
      resultDetail.textContent=`TOTAL：${r.penalties.length}\n${r.penalties.map((x,i)=>`${i+1}. ${x}`).join('\n')}\nLOSER：${r.loserName}`;
    } else if(pen.mode==='LEVEL'){
      resultPenalty.textContent=`LEVEL ${r.level}（${1+r.openedBonus}）`;
      resultDetail.textContent=`${r.penalties[0]||''}\nLOSER：${r.loserName}`;
    }else {
      resultPenalty.textContent=pen.mode==='IKKI'?`${r.shots} IKKI`:`${r.shots} SHOT${r.shots===1?'':'S'}`;
      resultDetail.textContent=`DEAD：${s.rules.deadPenalty}\nOPENED：${r.openedBonus} × ${s.rules.openedPenalty}\nLOSER：${r.loserName}`;
    }
    resultDetail.style.whiteSpace='pre-line';
    retryButton.disabled=identity.role!=='host';
    retryButton.textContent=identity.role==='host'?'PLAY AGAIN':'WAIT FOR HOST';
    onlineLeaveResult.hidden=false;onlineLeaveGame.hidden=true;onlineLeaveSetup.hidden=true;onlineKickSetup.hidden=true;
    onlineIndicator.hidden=false;onlineIndicator.textContent=`ROOM ${s.roomId} / RESULT`;
    showScreen(resultScreen);
  }
  async function receive(s){
    if(!identity||s.roomId!==identity.roomId)return;
    if(current&&s.match===current.match&&s.rev<current.rev)return;
    if(animating){pendingState=s;return;}
    const before=current;current=s;
    if(s.phase==='closed'){exitLocal('ホストが部屋を解散しました');return;}
    if(s.phase==='timeout'){exitLocal('通信切断から120秒が経過したため、設定に戻ります');return;}
    if(s.phase==='lobby'||s.phase==='guest_left'){
      if(identity.role==='host'&&s.phase==='lobby'&&!s.guestPresent&&before&&
          (before.phase!=='lobby'||before.guestPresent)){
        cleanEffects(true);if(bgm.paused)startBgm();
        lastBoard='';lastGame='';lastSetup='';lastResult='';pendingState=null;
        [onlineLeaveSetup,onlineKickSetup,onlineLeaveGame,onlineLeaveResult].forEach(b=>b.hidden=true);
        delete onlineContents.dataset.signature;
      }
      lobby(s);return;
    }
    if(s.phase==='setup'){setup(s);return;}
    if(s.phase==='game'||s.phase==='result'){
      const sameMatch=before && before.match===s.match;
      if(sameMatch&&before.phase==='game'&&s.lastRoll?.seq!==before.lastRoll?.seq&&s.lastRoll?.seq){
        animating=true;try{await animateDice(s.lastRoll.value);}finally{animating=false;}
      }
      if(sameMatch&&before.phase==='game'){
        const newOpen=[];
        s.seats.forEach((p,i)=>p.opened.forEach(card=>{
          if(!before.seats[i].opened.some(x=>x.index===card.index))newOpen.push({...card,owner:i});
        }));
        if(newOpen.length===1){
          const ev=newOpen[0];
          if(ev.type==='DEAD'&&s.phase==='result'){
            animating=true;
            try{
              beginGame(s,true);
              const own=ev.owner===myIndex();
              const target=(own?playerCards:cpuCards).querySelector(`.game-card[data-index="${ev.index}"]`);
              if(target)await startDeadEffect(target,s.winner===identity.role?'PLAYER':'CPU');
            }catch(e){console.error('DEAD animation',e);}finally{animating=false;}
          }else playSound(cardSound);
        }
      }
      if(s.phase==='result'){showResult(s);}
      else beginGame(s);
    }
    const pending=pendingState;pendingState=null;
    if(pending&&pending.rev>s.rev)await receive(pending);
  }

  // Original CPU/VS handlers remain installed. Online mode intercepts only its own actions.
  function intercept(button,fn){button.addEventListener('click',event=>{
    if(!identity||!isOnline())return;
    event.preventDefault();event.stopImmediatePropagation();fn();
  },true);}
  gameModeSelect.addEventListener('change',()=>{
    if(identity)return;
    applyGameMode();
    setupStartButton.textContent=isOnline()?'ONLINE ROOM':'SET DEAD';
  });
  // Retry on a user gesture if browser autoplay blocked the mode-screen BGM.
  function retryModeBgm(e){
    if(!modeScreen.classList.contains('active')||!bgm.paused||e.target.closest('#modeTitleButton, .mode-item'))return;
    if(bgm.getAttribute('src'))bgm.play().catch(()=>{});
    else startBgm();
  }
  modeScreen.addEventListener('click',retryModeBgm);
  modeScreen.addEventListener('change',retryModeBgm);
  modeScreen.querySelectorAll('.mode-item').forEach(button=>button.onclick=()=>{modeChoice.value=button.dataset.mode;modeChoice.dispatchEvent(new Event('change',{bubbles:true}));applyGameMode();if(isOnline())entryMenu();else{hostFields.hidden=true;settingsScreen.classList.remove('online-host-settings');showScreen(settingsScreen);}if(bgm.paused)startBgm();});
  modeTitleButton.onclick=()=>{stopBgm();window.location.href='../';};
  // Override original TITLE navigation only in detailed settings, returning to mode selector.
  byId('backTitleButton').addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();if(settingsScreen.classList.contains('online-host-settings'))entryMenu();else showScreen(modeScreen);if(bgm.paused)startBgm();},true);
  // Online room opens from existing 'SET DEAD' (CPU/VS remains unchanged).
  setupStartButton.addEventListener('click',e=>{
    if(!isOnline())return;
    e.preventDefault();e.stopImmediatePropagation();
    if(identity){beginPolling();refresh();}else if(settingsScreen.classList.contains('online-host-settings')){createHostRoom();}else{entryMenu();}
  },true);
  intercept(confirmSetupButton,()=>action('set',{dead:selectedDeadIndex,blind:blindMode}));
  intercept(setupBackButton,leave);
  intercept(retryButton,()=>{if(identity.role==='host')action('again');});
  intercept(settingsButton,leave);
  // Roll buttons are selected based on local/remote player's perspective, not host position.
  p1RollButton.addEventListener('click',e=>{if(!identity||!isOnline())return;e.preventDefault();e.stopImmediatePropagation();action('roll');},true);
  p2RollButton.addEventListener('click',e=>{if(!identity||!isOnline())return;e.preventDefault();e.stopImmediatePropagation();},true);
  rollButton.addEventListener('click',e=>{if(!identity||!isOnline())return;e.preventDefault();e.stopImmediatePropagation();},true);
  cpuCards.addEventListener('click',e=>{
    if(!identity||!isOnline()||busy||animating||current?.phase!=='game'||current.turn!==identity.role)return;
    const element=e.target.closest('.game-card');
    if(!element||!cpuCards.contains(element)||element.disabled)return;
    const index=Number(element.dataset.index);
    if(!Number.isInteger(index))return;
    action('open',{index});
  },true);
  [onlineLeaveSetup,onlineLeaveGame,onlineLeaveResult].forEach(b=>{b.onclick=leave;});
  onlineKickSetup.onclick=()=>action('kick');
  // Reset online UI when returning to CPU/VS; no extra listeners on existing game cards.
  window.addEventListener('pagehide',dropTimers);
  window.addEventListener('pageshow',e=>{
    if(e.persisted&&identity){beginPolling();if(!busy&&!animating)refresh();}
  });
  const saved=readIdentity();
  if(saved){
    identity=saved;saveIdentity();gameModeSelect.value='ONLINE';modeChoice.value='ONLINE';applyGameMode();lockOfflineScreens(true);
    showOnline('<h2>RECONNECTING...</h2><p>対戦ルームに再接続しています</p><button id="onlineCancelRestore" class="secondary-button">LEAVE ROOM</button>');
    byId('onlineCancelRestore').onclick=leave;
    // Reloaded pages may require a new user gesture before audio can play.
    const resumeAudio=()=>{
      if(identity&&current&&['lobby','setup','game'].includes(current.phase)&&!dangerMode&&bgm.paused)startBgm();
      if(!identity||current)document.removeEventListener('click',resumeAudio,true);
    };
    document.addEventListener('click',resumeAudio,true);
    beginPolling();refresh();
  }else {showScreen(modeScreen);startBgm();}
})();
;

<script src="../assets/dtg-settings-common.js"></script>
<script>
/* V13: only host settings presentation; original controls retain their listeners and values. */
(() => {

  function soundNodes(){

    const result=[];
    for(const control of original.querySelectorAll('select,input,button')){
      const wrap=control.closest('.setting-box')||control.parentElement;
      const label=control.labels?.[0]?.textContent||'';
      if(/(?:bgm|sound|volume|(?:^|[^a-z])se(?:$|[^a-z]))/i.test([control.id,control.name,label,wrap?.querySelector('label')?.textContent].join(' ')) && wrap && wrap!==original && !wrap.contains(byId('setupStartButton')))result.push(wrap);
    }
    return [...new Set(result)].filter(n=>!result.some(p=>p!==n&&p.contains(n)));
  }

<script>
/* V20: fit online result text to the report paper without changing its contents. */
(() => {
  const screen=document.getElementById('resultScreen');
  const sheet=screen.querySelector('.result-box');
  let frame=0;
  function fit(){
    frame=0;
    if(!screen.classList.contains('active')||!document.body.classList.contains('dtg-online-connected')){
      sheet.style.removeProperty('--report-unit');sheet.style.removeProperty('--report-paper-transform');return;
    }
    sheet.style.removeProperty('--report-unit');
    const start=parseFloat(getComputedStyle(sheet).width)/.59*.035;
    if(!start)return;
    const paperWidth=parseFloat(getComputedStyle(sheet).width)/.595;
    sheet.style.setProperty('--report-paper-transform',`matrix3d(0.9983413560,-0.0831951130,0,${0.0070000233/paperWidth},0.1440124670,0.9403166964,0,${-0.0873949150/paperWidth},0,0,1,0,0,0,0,1)`);
    const items=Array.from(sheet.children).filter(el=>getComputedStyle(el).display!=='none');
    const fits=()=>{
      const gap=parseFloat(getComputedStyle(sheet).rowGap)||0;
      return items.reduce((sum,el)=>sum+el.offsetHeight,0)+gap*Math.max(0,items.length-1)<=sheet.clientHeight-2
        && items.every(el=>el.scrollWidth<=el.clientWidth+1);
    };
    let low=0,high=start;
    sheet.style.setProperty('--report-unit',start+'px');
    if(fits())return;
    for(let i=0;i<16;i++){
      const middle=(low+high)/2;
      sheet.style.setProperty('--report-unit',middle+'px');
      if(fits())low=middle;else high=middle;
    }
    sheet.style.setProperty('--report-unit',low+'px');
  }
  function schedule(){if(!frame)frame=requestAnimationFrame(fit);}
  new MutationObserver(schedule).observe(screen,{attributes:true,attributeFilter:['class']});
  new MutationObserver(schedule).observe(document.body,{attributes:true,attributeFilter:['class']});
  new MutationObserver(schedule).observe(sheet,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['hidden','disabled']});
  new ResizeObserver(schedule).observe(sheet);
  window.addEventListener('resize',schedule);schedule();
})();
</script>

 const val=id=>byId(id)?.selectedOptions?.[0]?.textContent.trim()||'';
 function soundNodes(){

   for(const control of original.querySelectorAll('select,input,button')){
     const wrap=control.closest('.setting-box')||control.parentElement;
     const label=control.labels?.[0]?.textContent||'';

   }
   return [...new Set(result)].filter(n=>!result.some(p=>p!==n&&p.contains(n)));
 }
 function summary(){
