<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <title>DOA TARGET GUESS</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: #fff;

      font-family: Arial, sans-serif;

      overflow-x: hidden;

    }

    button,

    select {

      font: inherit;

    }

    button {

      cursor: pointer;

    }

    .screen {

      display: none;

      width: 100%;

      min-height: 100vh;

    }

    .container {

    h1,

    h2 {

    }

    .main-button {

      width: 100%;

      font-weight: bold;

    }

    .secondary-button {

      width: 100%;

      min-height: 48px;

      margin-top: 12px;

      border: 1px solid #777;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-weight: bold;

    }

    .setting-box {

      margin-top: 28px;

      text-align: left;

    }

    .setting-box label {

      display: block;

      margin-bottom: 8px;

      color: #fff;

      font-weight: bold;

      text-shadow: 0 1px 3px #000;

    }

    .setting-box select {

      width: 100%;

      height: 50px;

      padding: 0 12px;

      border: 1px solid #666;

      border-radius: 8px;

      background: #1c1c1c;

      color: #fff;

    }

    #setupScreen {

      justify-content: center;

    }

    #setupCards {

      --setup-count: 5;

      display: flex;

      flex-wrap: nowrap;

      justify-content: center;

      align-items: flex-end;

      gap: 8px;

      width: 100%;

      margin-top: 28px;

      overflow-x: auto;

      padding: 8px 0 16px;

    }

    .setup-card {

      flex: 0 0 auto;

      width: min(

        90px,

        calc(

          (

            100vw

            - 52px

            - (

              (var(--setup-count) - 1)

              * 8px

            )

          )

          / var(--setup-count)

        )

      );

      min-width: 34px;

      aspect-ratio: 63 / 88;

      padding: 0;

      border: 2px solid transparent;

      border-radius: 8px;

      overflow: hidden;

      background: transparent;

      transition:

        transform 0.18s ease,

        border-color 0.18s ease;

    }

    .setup-card.selected {

      border-color: #d00000;

      transform: translateY(-7px);

    }

    .setup-card img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    .setup-actions {

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 10px;

    }

    .setup-actions button {

      border: 1px solid #777;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.72);

      color: #fff;

      font-weight: bold;

    }

    #blindStatus {

      min-height: 24px;

      margin-top: 8px;

      color: #ddd;

      font-size: 13px;

      letter-spacing: 1px;

    }

    #gameScreen {

      position: relative;

      justify-content: center;

      overflow: hidden;

    }

    /* DTG GAME BACKGROUND */

#gameScreen {

  background-image: url("../images/doa-tate-back.PNG");

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

}

@media (orientation: landscape) {

  #gameScreen {

    background-image: url("../images/doa-yoko-back.PNG");

  }

}
    
    .game-wrap {

      width: 100%;

      max-width: 1180px;

      position: relative;

      z-index: 3;

    }

    .player-label {

      margin: 4px 0 8px;

      font-size: 15px;

      font-weight: bold;

      letter-spacing: 2px;

      text-shadow: 0 1px 4px #000;

    }

    .card-row {

      display: flex;

      justify-content: center;

      gap: 8px;

      width: 100%;

      min-height: 130px;

      perspective: 900px;

    }

    .game-card {

  width: min(

    110px,

    calc(

      (

        100vw

        - 52px

        - (

          (var(--card-count) - 1)

          * 8px

        )

      )

      / var(--card-count)

    )

  );

  aspect-ratio: 63 / 88;

  padding: 0;

  border: 0;

  border-radius: 8px;

  overflow: hidden;

  background: transparent;

  transition:

    transform 0.38s ease,

    opacity 0.38s ease,

    filter 0.2s ease;

  transform-style: preserve-3d;

}

    .game-card img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    .game-card.selectable {

      outline: 2px solid rgba(255, 255, 255, 0.8);

      animation: cardPulse 0.8s ease-in-out infinite alternate;

    }

    @keyframes cardPulse {

      from {

        filter: brightness(1);

      }

      to {

        filter: brightness(1.45);

      }

    }

    .cpu-card.opened {

      transform:

        perspective(700px)

        rotateX(58deg)

        translateY(20px);

      transform-origin: bottom center;

    }
    .cpu-card.opened img {

  transform: rotate(180deg);

}
    .player-card.opened {

      transform:

        perspective(800px)

        translateY(-16px)

        rotateX(32deg);

      transform-origin: bottom center;

    }

    

/* DTG STANDING CARDS */

/* CPU：テーブル奥側 */

.cpu-card:not(.opened) {

  transform:

    perspective(900px)

    rotateX(-13deg);

  transform-origin: center bottom;

  box-shadow:

    0 9px 8px rgba(0, 0, 0, 0.5),

    0 18px 14px rgba(0, 0, 0, 0.3);

}

/* YOU：テーブル手前側 */

.player-card:not(.opened) {

  transform:

    perspective(900px)

    rotateX(-13deg);

  transform-origin: center bottom;

  box-shadow:

    0 8px 7px rgba(0, 0, 0, 0.5),

    0 15px 12px rgba(0, 0, 0, 0.3);

}
    
    .dice-zone {

      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: center;

      gap: 18px;

      margin: 18px auto;

      width: 100%;

      max-width: 760px;

      min-height: 150px;

    }

    .roll-result {

      display: flex;

      flex-direction: column;

      justify-content: center;

      min-height: 92px;

      padding: 12px;

      border: 1px solid rgba(255, 255, 255, 0.45);

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.55);

    }

    .roll-label {

      font-size: 12px;

      letter-spacing: 2px;

      color: #bbb;

    }

    .roll-number {

      margin-top: 5px;

      font-size: 42px;

      font-weight: bold;

    }

    .center-dice-area {

      display: flex;

      flex-direction: column;

      align-items: center;

      min-width: 140px;

    }

    #centerDice {

      position: relative;
      
      display: flex;

      align-items: center;

      justify-content: center;

      width: 92px;

      height: 92px;

      border: 3px solid #ddd;

      border-radius: 18px;

      background: #f7f3e8;

      color: #111;

      font-size: 52px;

      font-weight: bold;

      box-shadow:

        0 6px 14px rgba(0, 0, 0, 0.45),

        inset 0 0 12px rgba(0, 0, 0, 0.15);

    }

    #centerDice .pip {

  position: absolute;

  width: 17%;

  height: 17%;

  border-radius: 50%;

  background: #111;

  transform: translate(-50%, -50%);

}

#centerDice .pip.red {

  width: 23%;

  height: 23%;

  background: #c00000;

}
    
    #centerDice.rolling {

      animation: diceRoll 0.16s linear infinite;

    }

    @keyframes diceRoll {

      0% {

        transform: rotate(0deg) translateY(0);

      }

      25% {

        transform: rotate(90deg) translateY(-8px);

      }

      50% {

        transform: rotate(180deg) translateY(0);

      }

      75% {

        transform: rotate(270deg) translateY(-5px);

      }

      100% {

        transform: rotate(360deg) translateY(0);

      }

    }

    #rollButton {

      width: 140px;

      min-height: 44px;

      margin-top: 10px;

      border: 1px solid #fff;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);

      color: #fff;

      font-weight: bold;

    }

    #rollButton:disabled {

      opacity: 0.35;

      cursor: default;

    }

    #status {

      min-height: 32px;

      margin-top: 8px;

      font-size: 19px;

      font-weight: bold;

      letter-spacing: 1px;

      text-shadow: 0 1px 4px #000;

    }

    #dangerOverlay {

      position: absolute;

      inset: 0;

      z-index: 1;

      background: rgba(150, 0, 0, 0);

      pointer-events: none;

      transition: background 0.4s ease;

    }

    #dangerOverlay.active {

      background: rgba(150, 0, 0, 0.20);

    }

/* DTG ECG — continuous monitor */

#ecgLayer {

  display: none;

  position: absolute;

  inset: 0;

  z-index: 4;

  overflow: hidden;

  pointer-events: none;

}

#ecgLayer.active {

  display: block;

}

#ecgCanvas {

  display: block;

  width: 100%;

  height: 100%;

}
    
    #deadFxOverlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 5000;

      overflow: hidden;

      pointer-events: none;

    }

    #deadFxOverlay.active {

      display: block;

    }

    #deadFxRed {

      position: absolute;

      inset: 0;

      z-index: 1;

      background: rgba(150, 0, 0, 0.42);

      opacity: 0;

      transition:

        opacity 0.35s linear;

    }

    #deadFxRed.show {

      opacity: 1;

    }

    #deadFxCard {

      position: absolute;

      z-index: 2;

      object-fit: cover;

      border-radius: 8px;

      transition:

        left 0.7s ease-out,

        top 0.7s ease-out,

        width 0.7s ease-out,

        height 0.7s ease-out,

        transform 0.7s ease-out;

    }

    #deadFxBullet {

      position: absolute;

      z-index: 3;

      width: 140vmax;

height: 140vmax;

object-fit: contain;

      opacity: 0;

      transform:

        translate(-50%, -50%)

        scale(0.7);

      transition:

        opacity 0.08s linear,

        transform 0.12s ease-out;

    }

    #deadFxBullet.show {

      opacity: 1;

      transform:

        translate(-50%, -50%)

        scale(1);

    }

    #deadFxResultText {

      position: absolute;

      left: 50%;

      top: 50%;

      z-index: 4;

      transform:

        translate(-50%, -50%)

        scale(0.8);

      opacity: 0;

      font-size: clamp(64px, 13vw, 150px);

      font-weight: 900;

      letter-spacing: 8px;

      color: #fff;

      -webkit-text-stroke: 2px #000;

      text-shadow:

        0 0 3px #000,

        0 0 10px rgba(0, 0, 0, 0.9);

      transition:

        opacity 0.22s ease,

        transform 0.22s ease;

    }

    #deadFxResultText.show {

      opacity: 1;

      transform:

        translate(-50%, -50%)

        scale(1);

    }

    #deadFxResultText.lose {

      color: #d00000;

    }

    #deadFxResultText.win {

      color: #fff;

    }

    

/* DEAD / WIN RESULT LOGOS */

#deadFxResultText {

  width: 100vw;

  display: flex;

  justify-content: center;

  align-items: center;

  pointer-events: none;

}

#deadFxResultText img {

  display: block;

  width: 90vw;

  max-height: 44svh;

  height: auto;

  object-fit: contain;

  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));

}

#deadFxResultText.lose img {

  flex: 0 0 auto;

}

@media (orientation: landscape) {

    max-height: 60svh;

  }

  #deadFxResultText.lose img {

  max-height: 85svh;

}

}

/* DTG LANDSCAPE DICE UI */

@media (orientation: landscape) {

  .dice-zone {

    width: fit-content;

    max-width: 100%;

    grid-template-columns: auto auto auto;

    gap: clamp(8px, 1.5vw, 16px);

  }

  .roll-result {

    width: 110px;

  }

}

/* DTG PORTRAIT DICE UI */

@media (orientation: portrait) {

  .dice-zone {

    width: fit-content;

    max-width: 100%;

    grid-template-columns: auto auto auto;

    gap: 8px;

  }

  .roll-result {

    width: 74px;

    padding: 8px;

  }

}

/* DTG DICE RESULT NUMBER ALIGN */

.roll-number {

  text-align: center;

}
  
/* VS standalone background — shared repository image */
#settingsScreen, #setupScreen, #gameScreen.vs-mode, #resultScreen {
  background-image: url("../images/doa-vs-back.PNG");
  background-position: center;
  background-size: cover;
}
/* VS MODE: top seat faces the opposite player */
#gameScreen.vs-mode .game-wrap { width: 100%; }
#gameScreen.vs-mode .vs-top-seat { transform: rotate(180deg); }
#gameScreen.vs-mode .vs-top-seat .cpu-card.opened img { transform: none; }
#gameScreen.vs-mode .vs-top-seat .cpu-card:not(.opened) { transform: none; }
#gameScreen.vs-mode .player-card:not(.opened) { transform: none; }
#gameScreen.vs-mode .game-wrap { display:flex; flex-direction:column; justify-content:space-between; min-height: min(88svh, 900px); }
#gameScreen.vs-mode .card-row { min-height: 0; }
#gameScreen.vs-mode .dice-zone { margin: 12px auto; }
#gameScreen.vs-mode .game-card { width:min(110px, calc((100vw - 52px - (var(--card-count) - 1)*8px)/var(--card-count))); }
#gameScreen.vs-mode .vs-bottom-seat { text-align:center; }
#gameScreen.vs-mode .vs-top-seat { text-align:center; }
#gameScreen.vs-mode .landscape-note { display:none; }
#handoffScreen { justify-content:center; background:#000; text-align:center; }
#handoffScreen .container { max-width:500px; }
#handoffText { font-size: clamp(24px,6vw,40px); letter-spacing:2px; }
#handoffScreen .main-button { margin-top:35px; }
@media (orientation: landscape) {
  #gameScreen.vs-mode .game-wrap { min-height:0; height:100%; }
}
  
/* DTG VS - TWO INDEPENDENT ROLL CONTROLS */

#gameScreen:is(.vs-mode, .online-mode) .dice-zone {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  width: 100%;

  min-height: 0;

  gap: 10px;

  margin: 12px auto;

}

/* Independent player controls */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row {

  position: relative;

  width: 268px;

  height: 84px;

  flex: none;

}

/* P2 faces the opposite direction */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row.p2-row {

  transform: rotate(180deg);

}

/* Result UI */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row .roll-result {

  position: absolute;

  top: 0;

  left: 79px;

  width: 110px;

  min-height: 76px;

  padding: 8px;

  text-align: center;

}

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row .roll-number {

  font-size: 32px;

}

/* ROLL button to the right of each result */

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-row .vs-roll-button {

  position: absolute;

  top: 9px;

  left: 199px;

  width: 66px;

  height: 58px;

  margin: 0;

  padding: 0 4px;

  border: 1px solid #fff;

  border-radius: 8px;

  background: rgba(0, 0, 0, 0.70);

  color: #fff;

  font-size: 13px;

  font-weight: bold;

  cursor: pointer;

}

#gameScreen:is(.vs-mode, .online-mode) .vs-roll-button:disabled {

  opacity: 0.35;

  cursor: default;

}

/* Shared central dice */

#gameScreen:is(.vs-mode, .online-mode) .center-dice-area {

  display: flex;

  align-items: center;

  justify-content: center;

  min-width: 0;

  width: 100%;

}

#gameScreen:is(.vs-mode, .online-mode) #centerDice {

  flex: none;

}
 
/* DTG VS - OPENED CARDS FLAT */

#gameScreen.vs-mode .game-card.opened {

  transform: none;

}

/* DTG VS - PLAYER 2 LOSE EFFECT */

#deadFxOverlay.p2-loss {

  transform: rotate(180deg);

  transform-origin: center center;

}   
  
/* DTG VS - P2 RESULT ROTATION */

#resultScreen.p2-lose .result-box {

  transform: rotate(180deg);

  transform-origin: center center;

}    

/* CPU BATTLE dice display */

#gameScreen:not(.vs-mode):not(.online-mode) .dice-zone {

  display: grid;

  grid-template-columns:

    minmax(0, 1fr) auto minmax(0, 1fr);

  align-items: center;

  width: 100%;

  max-width: 760px;

}

#gameScreen:not(.vs-mode):not(.online-mode) .vs-roll-row {

  position: static;

  width: auto;

  height: auto;

  transform: none;

}

#gameScreen:not(.vs-mode):not(.online-mode) .vs-roll-row.p1-row {

  grid-column: 1;

  grid-row: 1;

}

      if (!r.ok) throw new Error('Audio HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(bytes => new Promise((resolve, reject) => {
      ctx.decodeAudioData(bytes, resolve, reject);

      console.warn('DTG audio preload', key, e); return null;
    });
  });
  function source(key, loop) {
    if (!ctx || ctx.state !== 'running' || !buffers[key]) return null;
    const node = ctx.createBufferSource();
    node.buffer = buffers[key]; node.loop = loop;
    node.connect(ctx.destination);
    node.onended = () => node.disconnect();
    const at = ctx.currentTime;
    node.start();
    return { node, at, duration: node.buffer.duration };
  }

    if (!wantsHeart || heart || !heartbeatSound.paused) return;
    heartbeatSound.play().catch(e => console.warn('DTG heartbeat playback', e));
  }
  function tryHeart() {
    if (!wantsHeart || heart) return;
    if (!heartbeatSound.paused) return;
    try { heart = source('heartbeat', true); } catch (e) { console.warn('DTG heartbeat source', e); }
    if (!heart && (!ctx || !loads.heartbeat || ctx.state !== 'running')) nativeHeart();
  }
  function unlock(e) {
    if (!e.isTrusted || (gameModeSelect.value !== 'ONLINE' && !e.target.closest?.('[data-mode="ONLINE"]'))) return;
    if (ctx && ctx.state !== 'running') {

    }
    if (wantsHeart && (!ctx || !buffers.heartbeat)) nativeHeart();
  }

  document.addEventListener('touchend', unlock, true);
  return {
    startHeart() {
      wantsHeart = true;
      const request = ++heartRequest;
      tryHeart();

        if (!wantsHeart || request !== heartRequest) return;

let guestEcgClockAt = 0;
let guestEcgAudioTime = 0;

function syncHeartbeat() {

  if (!dangerMode || gameOver) {

    return;

  }

  const onlineClock = guestEcgFallback ? onlineCueAudio.clock() : null;
  let time = onlineClock ? onlineClock.time : heartbeatSound.currentTime;
  if (guestEcgFallback) {
    const now = performance.now();
    if (time !== guestEcgAudioTime) {
      guestEcgAudioTime = time;
      guestEcgClockAt = now;
    } else {
      const duration = onlineClock ? onlineClock.duration : heartbeatSound.duration;
      const cycle = Number.isFinite(duration) && duration > 16.27 ? duration : 17.2;
      time = (guestEcgAudioTime + Math.max(0, now - guestEcgClockAt) / 1000) % cycle;
    }
  }

  if (time < previousHeartbeatTime - 0.5) {

    heartbeatIndex = 0;

  }

  previousHeartbeatTime = time;

  while (

    heartbeatIndex < heartbeatTimes.length &&

    time >= heartbeatTimes[heartbeatIndex]

  ) {

    const beatTime =

      heartbeatTimes[heartbeatIndex];

    if (time - beatTime < 0.12) {

      pulseEcg(heartbeatIndex % 2 === 1);

    }

    heartbeatIndex++;

  }

  heartbeatFrame =

    requestAnimationFrame(syncHeartbeat);

}

  } else if (settings.mode === "LEVEL") {

    const count = 1 + openedBonus;

    const level = dtgPenaltyRanges.findIndex(

      ([min, max]) => count >= min && count <= max

  async function api(op, data={}, method='POST') {

    if(method!=='GET')options.body=JSON.stringify(data);
    const res=await fetch(API + '/api/' + op,options);
    let body; try {body=await res.json();}catch {throw new Error('通信応答の形式が不正です');}
    if(!res.ok) throw new Error(messageFor(body.error));

  const guestPaperCrops=new Map();
  function croppedGuestPaper(url){
    if(!guestPaperCrops.has(url))guestPaperCrops.set(url,new Promise(resolve=>{
      const source=new Image();
      source.onload=()=>{
        try{
          const canvas=document.createElement('canvas');canvas.width=source.naturalWidth;canvas.height=source.naturalHeight;
          const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(source,0,0);
          const w=canvas.width,h=canvas.height,px=ctx.getImageData(0,0,w,h).data;
          let l=w,t=h,r=-1,b=-1;
          for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>24){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y);}
          if(r<l||b<t){resolve(url);return;}
          const crop=document.createElement('canvas');crop.width=r-l+1;crop.height=b-t+1;
          crop.getContext('2d').drawImage(source,l,t,crop.width,crop.height,0,0,crop.width,crop.height);
          resolve(crop.toDataURL('image/png'));
        }catch(e){resolve(url);}
      };source.onerror=()=>resolve(url);source.src=url;
    }));
    return guestPaperCrops.get(url);
  }

  function lobbyRules(r){
    const p=r.penalty;
    const line=(label,value)=>`<p><strong>${escapeHtml(label)}</strong>：${escapeHtml(value)}</p>`;
    let details=line('ALIVE CARDS',r.alive)+line('DEAD CARD',1)+line('DICE MODE',`${r.rolls} ROLL`)+line('PENALTY TYPE',p.mode);
    if(p.mode==='RANDOM'){
      details+=line('DEAD CARD（抽選回数）',p.randomDead)+line('PER OPENED CARD（抽選回数）',1);
      details+=p.random.filter(Boolean).map((v,i)=>line(`PENALTY ${i+1}`,v)).join('');
    }else if(p.mode==='LEVEL'){
      details+=line('LEVEL判定','DEAD 1 ＋ 勝者側の開封枚数');
      dtgPenaltyRanges.forEach(([min,max],i)=>{
        if(min>r.alive+1)return;
        details+=line(`LEVEL ${i+1}（${min===max?min:min+'〜'+max}）`,p.level.slice(i*3,i*3+3).filter(Boolean).join(' / '));
      });
    }else{
      details+=line('DEAD CARD',`${r.deadPenalty} ${p.mode}`)+line('PER OPENED CARD',`${r.openedPenalty} ${p.mode}`);
    }
    const rows=(details.match(/<p><strong>.*?<\/strong>：.*?<\/p>/g)||[]).map(line=>{
      const m=line.match(/<p><strong>(.*?)<\/strong>：(.*?)<\/p>/);
      return m?`<div class="rule-row"><strong>${m[1]}</strong><span>${m[2]}</span></div>`:'';
    }).join('');
    return `<div class="details-card"><h3>ROOM DETAILS</h3><div class="rule-sheet">${rows}</div></div>`;
  }

  function setup(s) {

<script>
/* V20: fit online result text to the report paper without changing its contents. */
(() => {
  const screen=document.getElementById('resultScreen');
  const sheet=screen.querySelector('.result-box');
  let frame=0;
  function fit(){
    frame=0;
    if(!screen.classList.contains('active')||!document.body.classList.contains('dtg-online-connected')){
      sheet.style.removeProperty('--report-unit');sheet.style.removeProperty('--report-paper-transform');return;
    }
    sheet.style.removeProperty('--report-unit');
    const start=parseFloat(getComputedStyle(sheet).width)/.59*.035;
    if(!start)return;
    const paperWidth=parseFloat(getComputedStyle(sheet).width)/.595;
    sheet.style.setProperty('--report-paper-transform',`matrix3d(0.9983413560,-0.0831951130,0,${0.0070000233/paperWidth},0.1440124670,0.9403166964,0,${-0.0873949150/paperWidth},0,0,1,0,0,0,0,1)`);
    const items=Array.from(sheet.children).filter(el=>getComputedStyle(el).display!=='none');
    const fits=()=>{
      const gap=parseFloat(getComputedStyle(sheet).rowGap)||0;
      return items.reduce((sum,el)=>sum+el.offsetHeight,0)+gap*Math.max(0,items.length-1)<=sheet.clientHeight-2
        && items.every(el=>el.scrollWidth<=el.clientWidth+1);
    };
    let low=0,high=start;
    sheet.style.setProperty('--report-unit',start+'px');
    if(fits())return;
    for(let i=0;i<16;i++){
      const middle=(low+high)/2;
      sheet.style.setProperty('--report-unit',middle+'px');
      if(fits())low=middle;else high=middle;
    }
    sheet.style.setProperty('--report-unit',low+'px');
  }
  function schedule(){if(!frame)frame=requestAnimationFrame(fit);}
  new MutationObserver(schedule).observe(screen,{attributes:true,attributeFilter:['class']});
  new MutationObserver(schedule).observe(document.body,{attributes:true,attributeFilter:['class']});
  new MutationObserver(schedule).observe(sheet,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['hidden','disabled']});
  new ResizeObserver(schedule).observe(sheet);
  window.addEventListener('resize',schedule);schedule();
})();
</script>

 const fields=byId('localModalFields');let moved=[],trigger=null,wasActive=false,frame=0;
 const active=()=>screen.classList.contains('active')&&!screen.classList.contains('online-host-settings');
 const val=id=>byId(id)?.selectedOptions?.[0]?.textContent.trim()||'';
 function soundNodes(){
   const result=[];
   for(const control of original.querySelectorAll('select,input,button')){
     const wrap=control.closest('.setting-box')||control.parentElement;
     const label=control.labels?.[0]?.textContent||'';
     if(/(?:bgm|sound|volume|(?:^|[^a-z])se(?:$|[^a-z]))/i.test([control.id,control.name,label,wrap?.querySelector('label')?.textContent,control.tagName==='BUTTON'?control.textContent:''].join(' '))&&wrap&&wrap!==original&&!wrap.contains(byId('setupStartButton')))result.push(wrap);
   }
   return [...new Set(result)].filter(n=>!result.some(p=>p!==n&&p.contains(n)));
 }
 function summary(){
   const game=byId('localGameSummary'),penalty=byId('localPenaltySummary');
   game.replaceChildren();penalty.replaceChildren();
   function line(el,label,value){const d=document.createElement('div'),s=document.createElement('span');d.textContent=label;s.textContent=value;d.append(s);el.append(d);}
   line(game,'ALIVE CARDS',val('aliveCount'));line(game,'DICE MODE',val('diceMode'));
   line(penalty,'PENALTY TYPE',val('dtgPenaltyType'));
   if(!dtgDeadBox.hidden){line(penalty,'DEAD CARD',val('deadPenalty'));line(penalty,'PER OPENED CARD',val('openedPenalty'));}
 }

 function openModal(section,button){
   closeModal();trigger=button;

   for(const node of [...new Set(nodes.filter(Boolean))]){const marker=document.createComment('local original position');node.before(marker);fields.append(node);moved.push([node,marker]);}
