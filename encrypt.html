<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BGM暗号化ツール</title><style>body{font-family:system-ui;background:#151515;color:white;margin:30px auto;max-width:550px;padding:0 15px}button,input{font-size:18px;margin:12px 0}pre{word-break:break-all;white-space:pre-wrap;padding:10px;background:#333}</style><h1>BGM暗号化（端末内）</h1><p>音源はサーバーへ送らず、開いている端末のブラウザで処理します。</p><label>MP3を選択 <input type="file" id="file" accept="audio/mpeg,.mp3"></label><br><button id="go">暗号化して .bin を保存</button><p id="state"></p><p>下記の64文字をCloudflareの環境変数に保存（この画面から離れる前にコピー）：</p><pre id="key"></pre><script>const hex=a=>Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){alert('MP3を選択してください');return}try{const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,await f.arrayBuffer());const out=new Blob([iv,encrypted],{type:'application/octet-stream'});const u=URL.createObjectURL(out);const a=document.createElement('a');a.href=u;a.download=f.name.replace(/\.mp3$/i,'')+'.bin';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);document.getElementById('key').textContent=hex(new Uint8Array(await crypto.subtle.exportKey('raw',key)));document.getElementById('state').textContent='完了。binファイルと64文字の鍵を両方保存してください。'}catch(e){document.getElementById('state').textContent='失敗: '+e.message}}</script></html>
